<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlipsiTherm — Schaltschrank-Klimaauslegung</title>
<style>

[data-theme="dark"]{
  --accent:#4a9eda;--accent-dark:#7db8e8;--bg:#141a21;--card:#1d252e;--ink:#e4eaf0;
  --ink-soft:#93a3b3;--line:#2c3945;--ok:#5cb85c;--warn:#e0a458;--bad:#e05a52;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3);
}
[data-theme="dark"] input,[data-theme="dark"] select{background:#0f151b;border-color:var(--line)}
[data-theme="dark"] .kpi .box{border-left-color:var(--accent)}
[data-theme="dark"] .verdict{background:#1a2c40;border-color:var(--accent);color:var(--accent-dark)}
[data-theme="dark"] .report-page{background:#0f151b;border-color:var(--line)}
[data-theme="dark"] .report .norm{color:var(--ink-soft)}
[data-theme="dark"] details .inner{background:#0f151b}

:root{
  --accent:#0f4c81;--accent-dark:#0a3358;--bg:#f4f6f9;--card:#ffffff;--ink:#1c2733;
  --ink-soft:#5a6a7a;--line:#dde4ec;--ok:#1e7d32;--warn:#b25e09;--bad:#b3261e;
  --radius:10px;--shadow:0 1px 3px rgba(16,34,54,.08),0 4px 16px rgba(16,34,54,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
.wrap{max-width:960px;margin:0 auto;padding:24px 16px 64px}
header.top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:1.55rem;letter-spacing:.2px;color:var(--accent-dark)}
h1 .sub{font-size:.85rem;color:var(--ink-soft);font-weight:400;margin-left:6px}
.badge{font-size:.75rem;color:var(--ink-soft);background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px 10px}
.badge.online{color:var(--ok);border-color:var(--ok)}
.steps{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.step{flex:1;min-width:150px;padding:8px 12px;border-radius:var(--radius);background:var(--card);border:1px solid var(--line);font-size:.85rem;color:var(--ink-soft);cursor:pointer;transition:all .15s}
.step.active{border-color:var(--accent);color:var(--accent);font-weight:600;box-shadow:var(--shadow)}
.step.done{color:var(--ok)}
.step b{display:block;font-size:.75rem;font-weight:600;opacity:.7}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.card h2{font-size:1.05rem;margin-bottom:14px;color:var(--accent-dark)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
label{display:block;font-size:.78rem;color:var(--ink-soft);margin-bottom:4px;font-weight:600}
input,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:.95rem;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
fieldset{border:none;margin:14px 0}
fieldset legend{font-size:.8rem;font-weight:700;color:var(--ink-soft);margin-bottom:6px}
.hint{font-size:.76rem;color:var(--ink-soft);margin-top:4px}
.btn{display:inline-block;padding:10px 20px;border:none;border-radius:8px;font-size:.92rem;cursor:pointer;background:var(--accent);color:#fff;font-weight:600}
.btn:hover{background:var(--accent-dark)}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn.small{padding:6px 12px;font-size:.8rem}
.btnrow{display:flex;gap:10px;justify-content:space-between;margin-top:18px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.kpi .box{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--radius);padding:14px}
.kpi .box h3{font-size:.75rem;color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
.kpi .box .val{font-size:1.5rem;font-weight:700;color:var(--accent-dark)}
.kpi .box .sub{font-size:.75rem;color:var(--ink-soft)}
.verdict{padding:14px 16px;border-radius:var(--radius);margin-bottom:16px;font-weight:600;background:#e8f0fb;border:1px solid var(--accent);color:var(--accent-dark)}
details{margin-top:10px}
summary{cursor:pointer;font-size:.85rem;color:var(--accent);font-weight:600}
details .inner{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;margin-top:8px;font-size:.82rem}
table{width:100%;border-collapse:collapse;font-size:.82rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
th{color:var(--ink-soft);font-weight:600}
.menu{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.menu select{width:auto;padding:6px 8px;font-size:.8rem}
#report{display:none}
.report-page{background:#fff;padding:32px 40px;border:1px solid var(--line);border-radius:var(--radius)}
.report h1{font-size:1.25rem;margin-bottom:4px}
.report .meta{font-size:.8rem;color:var(--ink-soft);margin-bottom:18px}
.report table{width:100%;font-size:.8rem;margin-bottom:14px}
.report .norm{color:var(--ink-soft);font-style:italic}
.report h2{font-size:.95rem;margin:16px 0 8px;color:var(--accent-dark)}
.report .foot{font-size:.72rem;color:var(--ink-soft);margin-top:24px;border-top:1px solid var(--line);padding-top:8px}

@media print{
  html[data-theme="dark"]{--accent:#0f4c81;--accent-dark:#0a3358;--bg:#ffffff;--card:#ffffff;--ink:#1c2733;--ink-soft:#5a6a7a;--line:#dde4ec;--shadow:none}
}

@media print{
  body{background:#fff}
  .wrap>*:not(#report){display:none!important}
  #report{display:block!important}
  #report .report-page{border:none;box-shadow:none;padding:0}
}
@media(max-width:640px){.step{min-width:100%}}
</style>

<body>
<div class="wrap">
  <header class="top">
    <h1>FlipsiTherm<span class="sub" data-i18n="app.subtitle">Schaltschrank-Klimaauslegung</span></h1>
    <span id="catalogBadge" class="badge">…</span>
  </header>
  <div class="menu">
    <select id="langSel" style="width:auto"></select>
    <button class="btn ghost small" id="btnTheme" title="Hell/Dunkel">◐</button>
    <button class="btn ghost small" id="btnCustomers" data-i18n="customers.manage">Kunden</button>
    <button class="btn ghost small" id="btnSave" data-i18n="common.save_project">Projekt speichern</button>
    <button class="btn ghost small" id="btnLoad" data-i18n="common.load_project">Projekt laden</button>
    <button class="btn ghost small" id="btnCustomCat">Firmen-Katalog laden</button>
    <input type="file" id="fileProject" accept=".json" style="display:none">
    <input type="file" id="fileCustomCat" accept=".json" style="display:none">
  </div>
  <dialog id="dlgCustomers" style="border:none;border-radius:12px;max-width:640px;width:92%;padding:0">
    <div class="card" style="margin:0;border-radius:12px 12px 0 0;box-shadow:none">
      <h2 data-i18n="customers.manage">Kunden</h2>
      <div class="grid">
        <div><label data-i18n="customers.name">Firmenname *</label><input id="custName" type="text"></div>
        <div><label data-i18n="customers.contact">Ansprechpartner</label><input id="custContact" type="text"></div>
        <div><label data-i18n="customers.address">Adresse</label><input id="custAddress" type="text"></div>
        <div><label data-i18n="customers.note">Notiz</label><input id="custNote" type="text"></div>
      </div>
      <div class="hint" data-i18n="customers.hint">* Pflichtfeld — alles andere optional. Kunden bleiben lokal (im Projektfile bzw. Browser-Speicher), niemals auf GitHub.</div>
      <div class="btnrow"><button class="btn ghost" id="btnCustCancel" data-i18n="common.back">Zurück</button><button class="btn" id="btnCustAdd" data-i18n="customers.add">Hinzufügen</button></div>
      <div id="custList" style="margin-top:12px"></div>
    </div>
  </dialog>
  <div class="steps" id="stepsBar"></div>
  <div id="main"></div>
  <div id="report"></div>
</div>

<script>/**
 * FlipsiTherm Rechenkern v0.2
 * Herstellerneutrale Schaltschrank-Klimaauslegung
 *
 * Norm-Bezug (Implementierung aus offenen Sekundärquellen, Normtexte nicht kopiert):
 *  - IEC TR 60890 (DE: DIN VDE 0660-507): Temperaturerhöhung, b-Faktoren der Oberflächen
 *  - EN 61439-1 Abschnitt 7.1: Übliche Betriebsbedingungen (Umgebungstemperaturen, Feuchte)
 *  - Taupunkt: Magnus-Formel (gültig 0…60 °C, φ 1–100 %)
 *
 * Grundsatz: KEINE stillen Annahmen. Jede Annahme erscheint im Ergebnis als "assumptions".
 * v0.2: Kühl- und Heizzweig UNABHÄNGIG auswertbar (nur Heizen / nur Kühlen möglich),
 * validateInput als Plausibilitäts-Gate (UI + CI), Aufstellungsvarianten erweitert
 * (Anreihung, Raumaufheizung durch benachbarte Anlagen).
 */
(function (root, factory) {
  "use strict";
  if (typeof module === "object" && module.exports) { module.exports = factory(); }
  else { root.FlipsiThermKernel = factory(); }
})(typeof self !== "undefined" ? self : this, function () {
  "use strict";

  // ---------- Konstanten ----------

  /** Wärmedurchgangskoeffizienten W/(m²·K) je Werkstoff (offene Fachquellen: FISEKON, TGB) */
  var K_VALUES = {
    "stahl_lackiert": 5.5,
    "edelstahl": 3.7,
    "aluminium": 12.0,
    "polyester": 3.5,
    "doppelwand": 4.5
  };

  /** Oberflächen-b-Faktoren in Anlehnung an IEC TR 60890 (veröffentlicht u. a. bei B&R) */
  var SURFACE_FACTORS = {
    front: 0.9,
    rear_free: 0.9,
    rear_wall: 0.7,
    side_free: 0.9,
    side_wall: 0.7,
    top_free: 1.4,
    top_covered: 0.7,
    bottom: 0.7
  };

  var HEATING_RESERVE = 1.15;   // Sicherheitszuschlag Heizleistung
  var AIR_FLOW_FACTOR = 3.1;    // m³·K/(W·h) bei Meereshöhe
  var DEFAULT_RH = 60;          // % r. F. wenn nicht angegeben (Annahme wird gemeldet)
  var DEFAULT_TEXP = 25;        // °C erwartete Umgebung (Taupunkt-Referenz, FISEKON-Konvention)
  var DEFAULT_TINMIN = 5;       // °C Heizziel wenn nicht angegeben (typ. Frostschutz)

  /** EN 61439-1 / 7.1 Defaults */
  var EN61439 = {
    indoor: { tMax: 40, tMax24h: 35, tMin: -5 },
    outdoor: { tMax: 40, tMax24h: 35, tMin: -25 }
  };

  // ---------- Hilfsfunktionen ----------

  function round(x, digits) {
    var f = Math.pow(10, digits == null ? 1 : digits);
    return Math.round(x * f) / f;
  }

  function clamp(x, lo, hi) { return Math.min(Math.max(x, lo), hi); }

  /** Taupunkt nach Magnus (gültig 0…+60 °C, φ 1–100 %) */
  function dewPoint(tC, rhPercent) {
    var rh = clamp(rhPercent, 1, 100) / 100;
    var a = Math.log(rh) + (17.62 * tC) / (243.12 + tC);
    return (243.12 * a) / (17.62 - a);
  }

  /**
   * Wirksame Oberfläche nach b-Faktoren (IEC TR 60890-Muster).
   * m.sides: "free" (beide Seiten frei) | "row" (eine Seite Nachbarschrank/Anreihung) |
   *          "wall" (beide Seiten an Wand/Nische)
   * m.rear:  "free" | "wall" · m.top: "free" | "covered"
   */
  function effectiveSurface(e, m) {
    var B = e.widthB, H = e.heightH, T = e.depthT;
    var fRear = m.rear === "wall" ? SURFACE_FACTORS.rear_wall : SURFACE_FACTORS.rear_free;
    var fTop = m.top === "covered" ? SURFACE_FACTORS.top_covered : SURFACE_FACTORS.top_free;
    var fSideL, fSideR, noteSide;
    if (m.sides === "wall") { fSideL = SURFACE_FACTORS.side_wall; fSideR = SURFACE_FACTORS.side_wall; noteSide = "beide an Wand/Anreihung"; }
    else if (m.sides === "row") { fSideL = SURFACE_FACTORS.side_wall; fSideR = SURFACE_FACTORS.side_free; noteSide = "eine Seite Nachbarschrank/Wand"; }
    else { fSideL = SURFACE_FACTORS.side_free; fSideR = SURFACE_FACTORS.side_free; noteSide = "beide frei"; }
    var parts = {
      front: { factor: SURFACE_FACTORS.front, raw: B * H, area: SURFACE_FACTORS.front * B * H },
      rear: { factor: fRear, raw: B * H, raw_note: m.rear === "wall" ? "an Wand" : "frei", area: fRear * B * H },
      sideLeft: { factor: fSideL, raw: T * H, raw_note: noteSide, area: fSideL * T * H },
      sideRight: { factor: fSideR, raw: T * H, area: fSideR * T * H },
      top: { factor: fTop, raw: B * T, raw_note: m.top === "covered" ? "abgedeckt" : "frei", area: fTop * B * T },
      bottom: { factor: SURFACE_FACTORS.bottom, raw: B * T, area: SURFACE_FACTORS.bottom * B * T }
    };
    var area = 0, k;
    for (k in parts) { area += parts[k].area; }
    if (m.model === "fisekon_simplified") { area -= parts.bottom.area; }
    return { area: round(area, 3), breakdown: parts, model: m.model || "iec60890" };
  }

  /**
   * Verlustleistung einer Komponente.
   * Typen: direct | power_supply | drive | transformer | motor | netfilter
   */
  function componentLosses(c) {
    var f = c.loadFactor == null ? 1.0 : clamp(c.loadFactor, 0, 1);
    var eta, assumption = null;
    switch (c.type) {
      case "direct":
        return { losses: c.watts * f, formula: "P_v = " + c.watts + " W · a=" + f + " (Datenblatt · Auslastung)", assumption: null };
      case "power_supply":
        eta = c.efficiency == null ? 0.93 : c.efficiency;
        assumption = c.efficiency == null ? "η=0,93 angenommen (typ. Schaltnetzteil)" : null;
        return {
          losses: c.P_out_W * (1 - eta) / eta * f,
          formula: "P_v = P_out · (1−η)/η · a = " + c.P_out_W + " · (1−" + eta + ")/" + eta + " · " + f,
          assumption: assumption
        };
      case "drive":
        eta = c.efficiency == null ? 0.97 : c.efficiency;
        assumption = c.efficiency == null ? "η=0,97 für Umrichter angenommen (Forum-/Herstellertabellen)" : null;
        return {
          losses: c.P_N_W * (1 - eta) / eta * f,
          formula: "P_v = P_N · (1−η)/η · a = " + c.P_N_W + " W · (1−" + eta + ")/" + eta + " · " + f,
          assumption: assumption
        };
      case "transformer":
        eta = c.efficiency == null ? 0.95 : c.efficiency;
        assumption = c.efficiency == null ? "η=0,95 für Trafo angenommen" : null;
        return {
          losses: c.P_N_W * (1 - eta) / eta * f,
          formula: "P_v = P_N · (1−η)/η · a",
          assumption: assumption
        };
      case "motor":
        eta = c.efficiency == null ? 0.85 : c.efficiency;
        assumption = c.efficiency == null ? "η=0,85 für Motor angenommen" : null;
        return {
          losses: c.P_mech_W * (1 - eta) / eta * f,
          formula: "P_v = P_mech · (1−η)/η · a",
          assumption: assumption
        };
      case "netfilter":
        var dU = c.deltaU_V == null ? 0.5 : c.deltaU_V;
        assumption = c.deltaU_V == null ? "ΔU=0,5 V angenommen (typ. Einfügedämpfung Netzfilter)" : null;
        return {
          losses: dU * c.I_load_A * f,
          formula: "P_v = ΔU · I_b = " + dU + " V · " + c.I_load_A + " A · " + f,
          assumption: assumption
        };
      default:
        throw new Error("Unbekannter Komponententyp: " + c.type);
    }
  }

  /** Summierte Verlustleistung inkl. Stillstand-Anteil */
  function internalLosses(components) {
    var total = 0, idle = 0, details = [], assumptions = [], i, r;
    for (i = 0; i < components.length; i++) {
      r = componentLosses(components[i]);
      total += r.losses;
      details.push({ name: components[i].name || components[i].type, losses: round(r.losses, 1), formula: r.formula, assumption: r.assumption });
      if (r.assumption) { assumptions.push((components[i].name || components[i].type) + ": " + r.assumption); }
      if (components[i].countsAtIdle) { idle += r.losses; }
    }
    return { total: round(total, 1), idle: round(idle, 1), details: details, assumptions: assumptions };
  }

  // ---------- Plausibilitätsprüfung (UI-Gate + Tests) ----------

  /**
   * Prüft Eingaben auf Vollständigkeit (Pflicht je Zweig) und Plausibilität.
   * Kühlzweig: tMax + tInMax · Heizzweig: tMin (tInMin optional, Default +5 °C).
   * @returns {{errors: string[], warnings: string[], hasCooling: bool, hasHeating: bool}}
   */
  function validateInput(input) {
    var errors = [], warnings = [];
    var e = input.enclosure || {}, env = input.environment || {}, tgt = input.target || {};
    function need(cond, msg) { if (!cond) errors.push(msg); }
    function inRange(x, lo, hi) { return typeof x === "number" && isFinite(x) && x >= lo && x <= hi; }

    need(inRange(e.widthB, 0.1, 6), "Breite B muss zwischen 0,1 und 6 m liegen");
    need(inRange(e.heightH, 0.1, 4), "Höhe H muss zwischen 0,1 und 4 m liegen");
    need(inRange(e.depthT, 0.05, 3), "Tiefe T muss zwischen 0,05 und 3 m liegen");
    need(K_VALUES[input.material] != null, "Werkstoff nicht gewählt");

    var hasCooling = inRange(env.tMax, -55, 70) && inRange(tgt.tInMax, 0, 80);
    var hasHeating = inRange(env.tMin, -55, 20);
    if (!hasCooling && !hasHeating) {
      errors.push("Weder Kühl- noch Heizfall ausgefüllt: mind. maximale Umgebungstemperatur + zulässige Innentemperatur (Kühlung) ODER minimale Umgebungstemperatur (Heizung) angeben");
    }
    if (inRange(env.tMax, -55, 70) !== !!env.tMax && env.tMax != null && !inRange(env.tMax, -55, 70)) errors.push("Maximale Umgebungstemperatur unplausibel (−55…+70 °C)");
    if (env.tMax != null && !inRange(env.tMax, -55, 70)) errors.push("Maximale Umgebungstemperatur unplausibel (−55…+70 °C)");
    if (tgt.tInMax != null && !inRange(tgt.tInMax, 0, 80)) errors.push("Zulässige Innentemperatur unplausibel (0…+80 °C)");
    if (env.tMin != null && !inRange(env.tMin, -55, 20)) errors.push("Minimale Umgebungstemperatur unplausibel (−55…+20 °C)");
    if (env.rhPercent != null && !inRange(env.rhPercent, 1, 100)) errors.push("Luftfeuchte muss zwischen 1 und 100 % liegen");
    if (env.tExp != null && !inRange(env.tExp, -55, 70)) errors.push("Erwartete Umgebungstemperatur unplausibel (−55…+70 °C)");
    if (tgt.tInMin != null && !inRange(tgt.tInMin, -30, 60)) errors.push("Heizziel-Innentemperatur unplausibel (−30…+60 °C)");
    if (env.roomHeatingK != null && !inRange(env.roomHeatingK, 0, 30)) errors.push("Raumaufheizung 0…30 K");

    if (hasCooling && tgt.tInMax <= env.tMax) {
      warnings.push("Zulässige Innentemperatur ≤ maximale Umgebungstemperatur: Filterlüftung wirkungslos — es wird ein Kühlgerät bemessen (erwartetes Verhalten, falls Kühlgerät gewünscht)");
    }
    if (hasCooling && tgt.tInMax > 60) {
      warnings.push("Innentemperatur > 60 °C: nur mit Bauteilen zulässig, deren Datenblatt das hergibt (EN 61439 üblich ≤ 40 °C)");
    }
    if (hasHeating && tgt.tInMin != null && tgt.tInMin <= env.tMin) {
      warnings.push("Heizziel liegt auf/unter der minimalen Umgebungstemperatur: die Heizung hat dann keine Wirkung (ΔT ≤ 0) — Angabe prüfen");
    }
    if (env.tExp != null && env.tMax != null && env.tExp > env.tMax) {
      warnings.push("Erwartete Umgebungstemperatur ist höher als die maximale: bitte prüfen (max. sollte ≥ erwartet sein)");
    }

    (input.components || []).forEach(function (c, i) {
      var n = c.name || ("Komponente " + (i + 1));
      if (!inRange(c.loadFactor == null ? 1 : c.loadFactor, 0, 1)) errors.push(n + ": Auslastung a muss 0…1 sein");
      if (c.type === "direct" && !inRange(c.watts, 0.1, 50000)) errors.push(n + ": Verlustleistung 0,1…50 000 W angeben");
      if (c.type === "power_supply" && !inRange(c.P_out_W, 0.1, 50000)) errors.push(n + ": Ausgangsleistung 0,1…50 000 W angeben");
      if (c.type === "drive" && !inRange(c.P_N_W, 0.1, 2000000)) errors.push(n + ": Nennleistung 0,1…2 000 000 W angeben");
      if (c.type === "transformer" && !inRange(c.P_N_W, 0.1, 2000000)) errors.push(n + ": Nennleistung 0,1…2 000 000 W angeben");
      if (c.type === "motor" && !inRange(c.P_mech_W, 0.1, 2000000)) errors.push(n + ": mechanische Leistung 0,1…2 000 000 W angeben");
      if (c.type === "netfilter") {
        if (!inRange(c.I_load_A, 0.05, 2500)) errors.push(n + ": Betriebsstrom 0,05…2 500 A angeben");
        if (c.deltaU_V != null && !inRange(c.deltaU_V, 0, 5)) errors.push(n + ": ΔU 0…5 V");
      }
      if (c.efficiency != null && !inRange(c.efficiency, 0.3, 0.999)) errors.push(n + ": Wirkungsgrad 0,3…0,999");
    });

    return { errors: errors, warnings: warnings, hasCooling: hasCooling, hasHeating: hasHeating };
  }

  // ---------- Hauptberechnung ----------

  /**
   * Vollständige Klimaauslegung. Kühl- und Heizzweig unabhängig:
   * tMax+tInMax → Kühlfall · tMin → Heizfall. Raumaufheizung (roomHeatingK) addiert

/* ---------- i18n ---------- */
function t(key, vars){
  var src = EMBEDDED.lang[state.lang] || {};
  var s = (src[key] != null) ? src[key] : (EMBEDDED.lang.de[key] != null ? EMBEDDED.lang.de[key] : key);
  if (vars) for (var k in vars) s = s.replace("{"+k+"}", vars[k]);
  return s;
}
function flatten(obj, prefix){
  var out={};
  (function walk(o,p){ for (var k in o){ if (o[k] && typeof o[k]==="object") walk(o[k], p+k+"."); else out[p+k]=String(o[k]); } })(obj, prefix||"");
  return out;
}
function applyI18n(){
  document.documentElement.lang = state.lang;
  document.querySelectorAll("[data-i18n]").forEach(function(el){ el.textContent = t(el.getAttribute("data-i18n")); });
  renderSteps(); renderStep();
}

/* ---------- Kataloge ---------- */
function mergeCatalogs(){
  state.catDevices = [];
  EMBEDDED.catalogs.forEach(function(c){ c.devices.forEach(function(d){ state.catDevices.push(Object.assign({},d,{layer:1,hersteller:c.hersteller})); }); });
  (state.firmCatalog && state.firmCatalog.devices || []).forEach(function(d){ state.catDevices.push(Object.assign({},d,{layer:2})); });
  state.customDevs.forEach(function(d){ state.catDevices.push(Object.assign({},d,{layer:3})); });
}
function fetchJSON(url){ return fetch(url).then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); }); }
/* Client-seitige Katalog-Sanity: nur wohlgeformte, plausible Datensätze werden akzeptiert.
   (Daten-only bleibt gewahrt: JSON.parse + Feldprüfung, keine Ausführung.) */
function validateCatalog(c){
  if (!c || !Array.isArray(c.devices) || c.devices.length < 3) return false;
  if (typeof c.hersteller!=="string" || c.hersteller.length<2) return false;
  if (!/^\d{4}-\d{2}-\d{2}$/.test(c.stand||"")) return false;
  var TYPES={heizung:"leistung_W",filterluefter:"luftstrom_m3h",waermetauscher:"kuehlleistung_W",kuehlgeraet:"kuehlleistung_W"};
  for (var i=0;i<c.devices.length;i++){
    var d=c.devices[i], vf=TYPES[d.typ];
    if (!vf) return false;
    if (typeof d[vf]!=="number" || d[vf]<=0) return false;
    if (typeof d.bezeichnung!=="string" || d.bezeichnung.length<2) return false;
    if (d.status && d.status!=="verifiziert" && d.status!=="zu_verifizieren") return false;
  }
  return true;
}
function setBadge(stand, online){
  var b=document.getElementById("catalogBadge");
  b.textContent = t(online?"app.online_badge":"app.offline_badge", {stand:stand});
  b.classList.toggle("online", !!online);
}
async function autoRefresh(){ // NUR Daten nachladen (JSON) — niemals Code
  if (!EMBEDDED.config.autoUpdate || !navigator.onLine){ setBadge(EMBEDDED.config.catalogStand, false); return; }
  try{
    var fetched = await Promise.all(EMBEDDED.config.catalogFiles.map(function(f){ return fetchJSON(DATA_BASE+"data/catalogs/"+f); }));
    fetched = (fetched||[]).filter(function(c,i){ var ok=validateCatalog(c); if(!ok) console.warn("Katalog verworfen (Schema-Fail):", EMBEDDED.config.catalogFiles[i]); return ok; });
    if (fetched.length){
      EMBEDDED.catalogs = fetched;
      EMBEDDED.config.catalogStand = (fetched[0] && fetched[0].stand) || EMBEDDED.config.catalogStand;
    }
    var langIdx = await fetchJSON(DATA_BASE+"data/lang/index.json").catch(function(){ return {languages:[]}; });
    for (var li of (langIdx.languages||[])){
      try{ var raw = await fetchJSON(DATA_BASE+"data/lang/"+li+".json"); EMBEDDED.lang[li] = flatten(raw); }catch(e){}
    }
    refreshLangMenu();
    setBadge(EMBEDDED.config.catalogStand, true);
    mergeCatalogs();
  }catch(e){ setBadge(EMBEDDED.config.catalogStand, false); }
}
function refreshLangMenu(){
  var sel=document.getElementById("langSel"); var cur=sel.value; sel.innerHTML="";
  Object.keys(EMBEDDED.lang).sort().forEach(function(l){
    var o=document.createElement("option"); o.value=l; o.textContent=l.toUpperCase(); sel.appendChild(o);
  });
  sel.value=cur;
}

/* ---------- Wizard ---------- */
var STEPS=["1_title","2_title","3_title","4_title"];
function renderSteps(){
  var bar=document.getElementById("stepsBar"); bar.innerHTML="";
  STEPS.forEach(function(s,i){
    var d=document.createElement("div");
    d.className="step"+(state.step===i+1?" active":(state.step>i+1?" done":""));
    d.innerHTML="<b>"+(i+1)+"</b>"+t("steps."+s);
    d.onclick=function(){ goto(i+1); };
    bar.appendChild(d);
  });
}
function goto(n){ state.step=n; renderSteps(); renderStep(); window.scrollTo(0,0); }

/* ---------- Eingabehelfer ---------- */
function getPath(path,key){ return path.split(".").reduce(function(o,k){ return o[k]; }, state.project)[key]; }
function setPath(path,key,val){ path.split(".").reduce(function(o,k){ return o[k]; }, state.project)[key]=val; }
function esc(s){ return String(s).replace(/"/g,"&quot;").replace(/</g,"&lt;"); }
function numInput(label, key, step, stepAttr){
  return '<div><label>'+label+'</label><input type="number" step="'+(stepAttr||"0.1")+'" value="'+esc(getPath(step,key))+'" data-bind="'+key+'" data-step="'+step+'"></div>';
}
function bindInputs(container){
  container.querySelectorAll("input[data-bind]").forEach(function(inp){
    inp.addEventListener("input", function(){
      setPath(inp.getAttribute("data-step"), inp.getAttribute("data-bind"), parseFloat(inp.value||"0"));
    });
  });
  container.querySelectorAll("select[data-bind]").forEach(function(sel){
    sel.addEventListener("change", function(){
      if (sel.getAttribute("data-step")==="_material"){ state.project.material=sel.value; }
      else { setPath(sel.getAttribute("data-step"), sel.getAttribute("data-bind"), sel.value); }
    });
  });
}
function selVal(sel){ return state.project.mounting[sel.getAttribute("data-bind")]===sel.value; }

/* ---------- Komponenten ---------- */
var COMP_TYPES={
  direct:{label:"Direkteingabe (Datenblatt)",fields:[["watts","Verlustleistung (W)"]]},
  power_supply:{label:"Netzteil",fields:[["P_out_W","Ausgangsleistung (W)"],["efficiency","η (leer=0,93)"]]},
  drive:{label:"Frequenzumrichter",fields:[["P_N_W","Nennleistung (W)"],["efficiency","η (leer=0,97)"]]},
  transformer:{label:"Trafo",fields:[["P_N_W","Nennleistung (W)"],["efficiency","η (leer=0,95)"]]},
  motor:{label:"Motor",fields:[["P_mech_W","Mechanische Leistung (W)"],["efficiency","η (leer=0,85)"]]},
  netfilter:{label:"Netzfilter",fields:[["deltaU_V","Spannungsfall ΔU (V, leer=0,5)"],["I_load_A","Betriebsstrom (A)"]]}
};
function addEmptyComponent(){
  state.project.components.push({type:"direct",name:"",loadFactor:1,countsAtIdle:false});
  renderComponentList(document.getElementById("compList"));
}
function renderComponentList(el){
  el.innerHTML="";
  state.project.components.forEach(function(c,i){
    var row=document.createElement("div");
    row.className="card"; row.style.marginBottom="8px"; row.style.padding="12px";
    var fields=COMP_TYPES[c.type].fields.map(function(f){
      return '<div><label>'+f[1]+'</label><input type="number" step="0.01" value="'+esc(c[f[0]]!=null?c[f[0]]:"")+'" data-ci="'+i+'" data-cf="'+f[0]+'"></div>';
    }).join("");
    row.innerHTML='<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr))">'+
      '<div><label>Bezeichnung</label><input type="text" value="'+esc(c.name||"")+'" data-ci="'+i+'" data-cf="name" data-ctype="text"></div>'+
      '<div><label>Typ</label><select data-ci="'+i+'" data-cf="type" data-ctype="select">'+
      Object.keys(COMP_TYPES).map(function(k){ return '<option value="'+k+'"'+(k===c.type?" selected":"")+'>'+COMP_TYPES[k].label+'</option>'; }).join("")+
      '</select></div>'+fields+
      '<div><label>Auslastung a (0…1)</label><input type="number" step="0.05" min="0" max="1" value="'+esc(c.loadFactor!=null?c.loadFactor:1)+'" data-ci="'+i+'" data-cf="loadFactor"></div>'+
      '<div style="display:flex;align-items:flex-end;gap:8px"><label style="display:flex;align-items:center;gap:4px;font-weight:400"><input type="checkbox" style="width:auto" data-ci="'+i+'" data-cf="countsAtIdle" data-ctype="check"'+(c.countsAtIdle?" checked":"")+'> im Stillstand aktiv</label>'+
      '<button class="btn ghost small" data-del="'+i+'" style="margin-left:auto">✕</button></div></div>';
    el.appendChild(row);
  });
  el.querySelectorAll("[data-ci]").forEach(function(inp){
    inp.addEventListener("input", onCompChange); inp.addEventListener("change", onCompChange);
  });
  el.querySelectorAll("[data-del]").forEach(function(b){
    b.addEventListener("click", function(){ state.project.components.splice(parseInt(b.getAttribute("data-del"),10),1); renderComponentList(el); });
  });
}
function onCompChange(ev){
  var i=parseInt(ev.target.getAttribute("data-ci"),10), f=ev.target.getAttribute("data-cf");
  var c=state.project.components[i]; if(!c) return;
  var ct=ev.target.getAttribute("data-ctype");
  if (ct==="check") c[f]=ev.target.checked;
  else if (ct==="select"){ c[f]=ev.target.value; renderComponentList(document.getElementById("compList")); return; }
  else if (ct==="text") c[f]=ev.target.value;
  else c[f]=ev.target.value===""?null:parseFloat(ev.target.value);
}
function runCalc(){
  var v = FlipsiThermKernel.validateInput(state.project);
  var box = document.getElementById("gateErrors");
  var msg = "";
  if (v.errors.length) msg = v.errors.map(function(e){ return "⛔ "+esc(e); }).join("<br>");
  if (v.warnings.length) msg += (msg?"<br>":"") + v.warnings.map(function(w){ return "⚠ "+esc(w); }).join("<br>");
  if (box) box.innerHTML = msg;
  if (v.errors.length) return; // Pflichtwerte fehlen → kein Schritt 4
  try{
    state.lastResult = FlipsiThermKernel.calculate(state.project);
    goto(4);
  }catch(e){ alert("Eingabefehler: "+e.message); }
}

  var assumptions='<details><summary>'+t("results.assumptions")+' ('+r.assumptions.length+')</summary><div class="inner"><ul>'+
    (r.assumptions.length?r.assumptions.map(function(a){return "<li>"+esc(a)+"</li>";}).join(""):"<li>"+t("results.none")+"</li>")+'</ul></div></details>';
  root.innerHTML=kpi+
    '<div class="card"><h2>Geräte-Empfehlung</h2><div id="devTable"></div>'+assumptions+

    '<button class="btn" id="btnPrint">'+t("report.print")+'</button></div></div>';
  renderDeviceSuggestions(document.getElementById("devTable"));
  document.getElementById("btnPrint").onclick=buildReport;
}
function SOLUTIONS_KEY(s){ return SOLUTION_KEY_MAP[s]; }
var SOLUTION_KEY_MAP={passive:"results.solution_passive",filterfan:"results.solution_filterfan",heatexchanger:"results.solution_heatexchanger",cooling_unit:"results.solution_cooling_unit"};
function renderDeviceSuggestions(el){
  var r=state.lastResult; var rows=""; var need={};
  if (r.cooling.solution==="filterfan"){ need.filterluefter=r.cooling.airflow_m3h; need.waermetauscher=r.cooling.qCool; }
  if (r.cooling.solution==="cooling_unit") need.kuehlgeraet=r.cooling.qCool;
  if (r.heating.required>0) need.heizung=r.heating.required;
  var TYP_LABELS={heizung:"Heizung",filterluefter:"Filterlüfter",waermetauscher:"L/L-Wärmetauscher",kuehlgeraet:"Kühlgerät"};
  for (var typ in need){
    (function(typ){
      var req=need[typ];
      var fit=state.catDevices.filter(function(d){ return d.typ===typ &&
        (typ==="heizung" ? (d.leistung_W||0)>=req*0.9 :
         typ==="filterluefter" ? (d.luftstrom_m3h||0)>=req :
         typ==="waermetauscher" ? (d.waermeleistung_wk ? d.waermeleistung_wk*(r.cooling.dT||1)>=req : (d.kuehlleistung_W||0)>=req) :
         (d.kuehlleistung_W||0)>=req); });
      fit.sort(function(a,b){ return (a.leistung_W||a.kuehlleistung_W||((a.waermeleistung_wk||0)*(r.cooling.dT||1)))-(b.leistung_W||b.kuehlleistung_W||((b.waermeleistung_wk||0)*(r.cooling.dT||1))); });
      rows+="<tr><td colspan='5' style='font-weight:600;color:var(--accent-dark);padding-top:12px'>"+TYP_LABELS[typ]+" ≥ "+Math.round(req)+"</td></tr>";
      fit.slice(0,4).forEach(function(d){
        rows+="<tr><td>"+esc(d.hersteller)+"</td><td>"+esc(d.bezeichnung)+(d.kuehl_nennbedingung?" <span class='badge'>"+esc(d.kuehl_nennbedingung)+"</span>":"")+"</td><td>"+(d.leistung_W?d.leistung_W+" W":d.waermeleistung_wk?d.waermeleistung_wk+" W/K (≈"+Math.round(d.waermeleistung_wk*(r.cooling.dT||1))+" W bei ΔT "+r.cooling.dT+" K)":d.kuehlleistung_W+" W")+(d.artikel_nr?" · Art. "+esc(d.artikel_nr):"")+"</td><td><span class='badge'>"+["","Community","Firma","Projekt"][d.layer]+"</span>"+(d.status==="zu_verifizieren"?" <span class='badge'>⚠ zu verifizieren</span>":"")+"</td><td>"+(d.quell_url?"<a href='"+d.quell_url+"' target='_blank' rel='noopener'>Quelle</a>":"")+"</td></tr>";
      });
      if (typ==="waermetauscher" && fit.length===0) rows+="<tr><td colspan='5' class='hint'>Kein Wärmetauscher im Katalog — bei Schmutz/Öl-Einsatz selbst ergänzen (Firmen-Katalog).</td></tr>";
    })(typ);
  }
  el.innerHTML="<table><tr><th>Hersteller</th><th>Gerät</th><th>Wert</th><th>Herkunft</th><th></th></tr>"+rows+"</table>"+
    "<div class='hint'>Katalog-Stand "+EMBEDDED.config.catalogStand+" · ⚠ = Datensatz noch gegen Herstellerkatalog zu verifizieren · Filterlüfter-Werte freiblasend; Gegendruck beachten (Protokoll-Hinweis)</div>";
}

/* ---------- Protokoll ---------- */
function reportData(r){
  var p=state.project;
  var rows=[
    ["ΔT Kühlfall", r.cooling.dT+" K", "ΔT = T_zul,innen − T_um,max", "IEC TR 60890"],
    ["Hüllabgabe Kühlfall", r.cooling.shellDissipation+" W", "Q = k·A·ΔT", "IEC TR 60890"],
    ["Kühlbedarf", r.cooling.qCool+" W", "Q_K = P_v − k·A·ΔT", "IEC TR 60890"]
  ];
  if (r.cooling.airflow_m3h>0) rows.push(["Luftvolumenstrom", r.cooling.airflow_m3h+" m³/h","V = 3,1·Q/ΔT","offene Fachliteratur (ρ·cp, h)"]);
  rows.push(["Taupunkt (erwartete Umgebung)", r.heating.dewPoint+" °C","Magnus-Formel","gültig 0…60 °C / φ 1–100 %"]);
  rows.push(["Heizbedarf Frostschutz", r.heating.pFrost+" W","(k·A·ΔT − P_idle)·1,15","IEC TR 60890 + Praxis-Zuschlag 15 %"]);
  rows.push(["Heizbedarf Betauung", r.heating.pDew+" W","(k·A·(τ − T_min) − P_idle)·1,15","Konvention nach FISEKON-Modell"]);
  rows.push(["Auslegungs-Heizleistung", r.heating.required+" W","max(Frost, Betauung)","—"]);
  var cust = state.customers.find(function(c){ return c.name===p.customer.name; }) || null;
  return {
    customer: p.customer.name||"—",
    ref: p.customer.ref||"",
    custContact: (cust&&cust.contact)||"",
    custAddress: (cust&&cust.address)||"",
    date: new Date().toLocaleDateString("de-AT"),
    sw: r.meta.tool+" v"+r.meta.version,
    catStand: EMBEDDED.config.catalogStand,
    inputs: [
      ["Schrank B×H×T", p.enclosure.widthB+" × "+p.enclosure.heightH+" × "+p.enclosure.depthT+" m"],
      ["Werkstoff (k-Wert)", p.material+" (k = "+r.kValue+" W/(m²·K))"],
      ["Aufstellung", "Rückseite "+p.mounting.rear+" · Seiten "+p.mounting.sides+" · oben "+p.mounting.top],
      ["Wirksame Oberfläche", r.surface.area+" m² (b-Faktoren, Summe je Fläche siehe unten)"],
      ["Umgebung", "max "+r.environment.tMax+" °C · erwartet "+r.heating.tExp+" °C · min "+r.environment.tMin+" °C · φ "+r.environment.rhPercent+" %"],
      ["Ziel-Innentemperatur", "max "+r.target.tInMax+" °C · Heizziel "+r.target.tInMin+" °C"],
      ["Verlustleistung", r.losses.total+" W (davon im Stillstand: "+r.losses.idle+" W)"]
    ],
    surfaceRows: Object.keys(r.surface.breakdown).map(function(k){
      var b=r.surface.breakdown[k];
      return [k, "b="+b.factor, (b.raw?b.raw.toFixed(3):"0")+" m² → "+b.area.toFixed(3)+" m²"+(b.raw_note?" ("+b.raw_note+")":"")];
    }),
    calc: rows,
    assumptions: r.assumptions,
    losses: r.losses.details,
    normRefs: r.meta.normRefs
  };
}
function buildReport(){
  var r=state.lastResult; if(!r) return;
  var d=reportData(r);
  var el=document.getElementById("report");
  el.innerHTML='<div class="report-page report"><h1>'+t("report.header")+'</h1>'+
    '<div class="meta"><b>'+esc(d.customer)+'</b>'+(d.custAddress?" · "+esc(d.custAddress):"")+(d.custContact?" · "+esc(d.custContact):"")+(d.ref?" · <b>"+esc(d.ref)+"</b>":"")+'</div>'+
    '<div class="meta">'+d.date+' · '+d.sw+' · '+t("app.cat_stand")+' '+d.catStand+'</div>'+
    '<h2>'+t("report.inputs")+'</h2><table><tbody>'+
    d.inputs.map(function(x){ return "<tr><td style='width:38%'>"+esc(x[0])+"</td><td><b>"+esc(x[1])+"</b></td></tr>"; }).join("")+'</tbody></table>'+
    '<h2>Wirksame Oberfläche (je Fläche, b-Faktoren)</h2><table><thead><tr><th>Fläche</th><th>Faktor</th><th>Wirksam</th></tr></thead><tbody>'+
    d.surfaceRows.map(function(x){ return "<tr><td>"+esc(x[0])+"</td><td>"+esc(x[1])+"</td><td>"+esc(x[2])+"</td></tr>"; }).join("")+'</tbody></table>'+
    '<h2>Verlustleistung der Komponenten</h2><table><thead><tr><th>Komponente</th><th>Verlust</th><th>'+t("report.formula")+'</th></tr></thead><tbody>'+
    (d.losses.length?d.losses.map(function(x){ return "<tr><td>"+esc(x.name)+"</td><td><b>"+x.losses+" W</b></td><td>"+esc(x.formula)+"</td></tr>"; }).join(""):"<tr><td colspan=3>—</td></tr>")+'</tbody></table>'+
    '<h2>'+t("report.calculation")+'</h2><table><thead><tr><th>Größe</th><th>Ergebnis</th><th>'+t("report.formula")+'</th><th>'+t("report.norm")+'</th></tr></thead><tbody>'+
    d.calc.map(function(x){ return "<tr><td>"+esc(x[0])+"</td><td><b>"+esc(x[1])+"</b></td><td>"+esc(x[2])+"</td><td class='norm'>"+esc(x[3])+"</td></tr>"; }).join("")+'</tbody></table>'+
    (d.assumptions.length?("<h2>"+t("results.assumptions")+"</h2><ul style='font-size:.8rem'>"+d.assumptions.map(function(a){return "<li>"+esc(a)+"</li>";}).join("")+"</ul>"):"")+
    '<div class="foot">'+t("report.footer_note")+' · Norm-Referenzen: '+d.normRefs.map(esc).join(" · ")+'</div></div>';
  el.style.display="block";
  window.print();
}

/* ---------- Projekt + Firmen-Katalog ---------- */
function saveProject(){
  var blob=new Blob([JSON.stringify({flipsitherm_project:"2",saved:new Date().toISOString(),project:state.project,customDevs:state.customDevs,customers:state.customers},null,2)],{type:"application/json"});
  var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="FlipsiTherm-Projekt.json"; a.click();
}
function loadProject(file){
  file.text().then(function(txt){
    var j=JSON.parse(txt);
    if (j.flipsitherm_project!=="1") throw new Error("kein FlipsiTherm-Projekt");
    state.project=j.project; state.customDevs=j.customDevs||[]; state.customers=j.customers||[]; mergeCatalogs(); renderCustomerSelect(); goto(1);
  }).catch(function(e){ alert("Projektdatei unlesbar: "+e.message); });
}
function loadCustomCatalog(file){
  file.text().then(function(txt){
    var j=JSON.parse(txt);
    if (!j.devices) throw new Error("Feld 'devices' fehlt");
    j.devices.forEach(function(d){ d.layer=2; if(!d.hersteller) d.hersteller=j.hersteller||"Firmenkatalog"; });
    state.firmCatalog=j; mergeCatalogs();
    alert("Firmen-Katalog geladen: "+j.devices.length+" Geräte (nur lokal, bleibt firmenintern)");
  }).catch(function(e){ alert("Katalogdatei unlesbar: "+e.message); });
}

/* ---------- Kundenverwaltung (lokal, niemals öffentlich) ---------- */
function loadCustomers(){
  try { return JSON.parse(localStorage.getItem("flipsitherm_customers")||"[]"); } catch(e){ return []; }
}
function saveCustomers(list){ try { localStorage.setItem("flipsitherm_customers", JSON.stringify(list)); } catch(e){} }
function renderCustomerSelect(){
  var sel=document.getElementById("custSelect"); if(!sel) return;
  var cur=state.project.customer.name||"";
  sel.innerHTML='<option value="">— '+t("customers.none")+' —</option>';
  state.customers.forEach(function(c,i){
    var o=document.createElement("option"); o.value=c.name; o.textContent=c.name+(c.address?" · "+c.address:""); sel.appendChild(o);
  });
  sel.value=cur;
}
function renderCustomerList(){
  var el=document.getElementById("custList"); el.innerHTML="";
  state.customers.forEach(function(c,i){
    var row=document.createElement("div");
    row.className="hint"; row.style.display="flex"; row.style.gap="8px"; row.style.alignItems="center";
    row.innerHTML="<span style='color:var(--ink)'><b>"+esc(c.name)+"</b>"+(c.address?" · "+esc(c.address):"")+(c.note?" · "+esc(c.note):"")+"</span>";
    var del=document.createElement("button"); del.className="btn ghost small"; del.textContent="✕";
    del.onclick=function(){ state.customers.splice(i,1); saveCustomers(state.customers); renderCustomerSelect(); renderCustomerList(); };
    row.appendChild(del); el.appendChild(row);
  });
}
function applyTheme(){
  var th = localStorage.getItem("flipsitherm_theme") || "light";
  document.documentElement.setAttribute("data-theme", th);
  document.getElementById("btnTheme").textContent = th==="dark" ? "☀" : "◐";
}
function toggleTheme(){
  var th = (localStorage.getItem("flipsitherm_theme")==="dark") ? "light" : "dark";
  localStorage.setItem("flipsitherm_theme", th); applyTheme();
}

/* ---------- Boot ---------- */
function boot(){
  // eingebettete Sprachen (nested JSON) → flache Keys
  Object.keys(EMBEDDED.lang).forEach(function(l){
    if (typeof EMBEDDED.lang[l]==="object" && EMBEDDED.lang[l].app) EMBEDDED.lang[l]=flatten(EMBEDDED.lang[l]);
  });
  var sel=document.getElementById("langSel");
  sel.addEventListener("change",function(){ state.lang=sel.value; applyI18n(); });
  document.getElementById("btnSave").onclick=saveProject;
  document.getElementById("btnLoad").onclick=function(){ document.getElementById("fileProject").click(); };
  document.getElementById("fileProject").addEventListener("change",function(e){ if(e.target.files[0]) loadProject(e.target.files[0]); });
  document.getElementById("btnCustomCat").onclick=function(){ document.getElementById("fileCustomCat").click(); };
  document.getElementById("fileCustomCat").addEventListener("change",function(e){ if(e.target.files[0]) loadCustomCatalog(e.target.files[0]); });
  // Theme
  applyTheme();
  document.getElementById("btnTheme").addEventListener("click", toggleTheme);
  // Kunden laden (Browser-Speicher) + Dialog
  try { state.customers = JSON.parse(localStorage.getItem("flipsitherm_customers")||"[]"); } catch(e){ state.customers=[]; }
  var dlg=document.getElementById("dlgCustomers");
  document.getElementById("btnCustomers").onclick=function(){ renderCustomerList(); dlg.showModal(); };
  document.getElementById("btnCustCancel").onclick=function(){ dlg.close(); };
  document.getElementById("btnCustAdd").onclick=function(){
    var n=document.getElementById("custName").value.trim();
    if(!n){ alert(t("customers.name_required")); return; }
    state.customers.push({name:n, contact:document.getElementById("custContact").value.trim(), address:document.getElementById("custAddress").value.trim(), note:document.getElementById("custNote").value.trim()});
    saveCustomers(state.customers);
    document.getElementById("custName").value=""; document.getElementById("custContact").value=""; document.getElementById("custAddress").value=""; document.getElementById("custNote").value="";
    renderCustomerSelect(); renderCustomerList();
  };
  mergeCatalogs(); refreshLangMenu(); sel.value=state.lang;
  renderSteps(); renderStep(); applyI18n();
  autoRefresh();
}
document.addEventListener("DOMContentLoaded",boot);
</script>
</body>
