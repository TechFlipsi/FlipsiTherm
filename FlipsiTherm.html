<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlipsiTherm — Schaltschrank-Klimaauslegung</title>
<style>

[data-theme="dark"]{
  --accent:#4a9eda;--accent-dark:#7db8e8;--bg:#141a21;--card:#1d252e;--ink:#e4eaf0;
  --ink-soft:#93a3b3;--line:#2c3945;--ok:#5cb85c;--warn:#e0a458;--bad:#e05a52;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3);
}
[data-theme="dark"] input,[data-theme="dark"] select{background:#0f151b;border-color:var(--line)}
[data-theme="dark"] .kpi .box{border-left-color:var(--accent)}
[data-theme="dark"] .verdict{background:#1a2c40;border-color:var(--accent);color:var(--accent-dark)}
[data-theme="dark"] .report-page{background:#0f151b;border-color:var(--line)}
[data-theme="dark"] .report .norm{color:var(--ink-soft)}
[data-theme="dark"] details .inner{background:#0f151b}

:root{
  --accent:#0f4c81;--accent-dark:#0a3358;--bg:#f4f6f9;--card:#ffffff;--ink:#1c2733;
  --ink-soft:#5a6a7a;--line:#dde4ec;--ok:#1e7d32;--warn:#b25e09;--bad:#b3261e;
  --radius:10px;--shadow:0 1px 3px rgba(16,34,54,.08),0 4px 16px rgba(16,34,54,.06);
}
/* Discord-Community-Button (unten rechts, klein & unauffällig) */
.discord-corner{position:fixed;right:10px;bottom:10px;z-index:900;display:flex;flex-direction:column;align-items:center;gap:2px;opacity:.45;transition:opacity .2s;text-decoration:none}
.discord-corner:hover{opacity:.95}
.discord-corner .dc-label{font-size:.68rem;color:var(--ink-soft);line-height:1;order:2}
.discord-corner .dc-btn{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:999px;background:rgba(88,101,242,.9);color:#fff;font-size:.75rem;font-weight:600;box-shadow:var(--shadow);border:none;cursor:pointer}
.discord-corner svg{width:13px;height:13px;fill:#fff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
.wrap{max-width:960px;margin:0 auto;padding:24px 16px 64px}
header.top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:1.55rem;letter-spacing:.2px;color:var(--accent-dark)}
h1 .sub{font-size:.85rem;color:var(--ink-soft);font-weight:400;margin-left:6px}
.badge{font-size:.75rem;color:var(--ink-soft);background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px 10px}
.badge.online{color:var(--ok);border-color:var(--ok)}
.steps{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.step{flex:1;min-width:150px;padding:8px 12px;border-radius:var(--radius);background:var(--card);border:1px solid var(--line);font-size:.85rem;color:var(--ink-soft);cursor:pointer;transition:all .15s}
.step.active{border-color:var(--accent);color:var(--accent);font-weight:600;box-shadow:var(--shadow)}
.step.done{color:var(--ok)}
.step b{display:block;font-size:.75rem;font-weight:600;opacity:.7}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.card h2{font-size:1.05rem;margin-bottom:14px;color:var(--accent-dark)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
label{display:block;font-size:.78rem;color:var(--ink-soft);margin-bottom:4px;font-weight:600}
input,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:.95rem;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
fieldset{border:none;margin:14px 0}
fieldset legend{font-size:.8rem;font-weight:700;color:var(--ink-soft);margin-bottom:6px}
.hint{font-size:.76rem;color:var(--ink-soft);margin-top:4px}
.btn{display:inline-block;padding:10px 20px;border:none;border-radius:8px;font-size:.92rem;cursor:pointer;background:var(--accent);color:#fff;font-weight:600}
.btn:hover{background:var(--accent-dark)}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn.small{padding:6px 12px;font-size:.8rem}
.btnrow{display:flex;gap:10px;justify-content:space-between;margin-top:18px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.kpi .box{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--radius);padding:14px}
.kpi .box h3{font-size:.75rem;color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
.kpi .box .val{font-size:1.5rem;font-weight:700;color:var(--accent-dark)}
.kpi .box .sub{font-size:.75rem;color:var(--ink-soft)}
.verdict{padding:14px 16px;border-radius:var(--radius);margin-bottom:16px;font-weight:600;background:#e8f0fb;border:1px solid var(--accent);color:var(--accent-dark)}
details{margin-top:10px}
summary{cursor:pointer;font-size:.85rem;color:var(--accent);font-weight:600}
details .inner{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;margin-top:8px;font-size:.82rem}
table{width:100%;border-collapse:collapse;font-size:.82rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
th{color:var(--ink-soft);font-weight:600}
.menu{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.menu select{width:auto;padding:6px 8px;font-size:.8rem}
#report{display:none}
.report-page{background:#fff;padding:32px 40px;border:1px solid var(--line);border-radius:var(--radius)}
.report h1{font-size:1.25rem;margin-bottom:4px}
.report .meta{font-size:.8rem;color:var(--ink-soft);margin-bottom:18px}
.report table{width:100%;font-size:.8rem;margin-bottom:14px}
.report .norm{color:var(--ink-soft);font-style:italic}
.report h2{font-size:.95rem;margin:16px 0 8px;color:var(--accent-dark)}
.report .foot{font-size:.72rem;color:var(--ink-soft);margin-top:24px;border-top:1px solid var(--line);padding-top:8px}

@media print{
  html[data-theme="dark"]{--accent:#0f4c81;--accent-dark:#0a3358;--bg:#ffffff;--card:#ffffff;--ink:#1c2733;--ink-soft:#5a6a7a;--line:#dde4ec;--shadow:none}
}

@media print{
  body{background:#fff}
  .wrap>*:not(#report){display:none!important}
  #report{display:block!important}
  #report .report-page{border:none;box-shadow:none;padding:0}
}
@media(max-width:640px){.step{min-width:100%}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>FlipsiTherm<span class="sub" data-i18n="app.subtitle">Schaltschrank-Klimaauslegung</span></h1>
    <span id="catalogBadge" class="badge">…</span>
  </header>
  <div class="menu">
    <select id="langSel" style="width:auto"></select>
    <button class="btn ghost small" id="btnTheme" title="Hell/Dunkel">◐</button>
    <button class="btn ghost small" id="btnCustomers" data-i18n="customers.manage">Kunden</button>
    <button class="btn ghost small" id="btnSave" data-i18n="common.save_project">Projekt speichern</button>
    <button class="btn ghost small" id="btnLoad" data-i18n="common.load_project">Projekt laden</button>
    <button class="btn ghost small" id="btnCustomCat" data-i18n="msg.custom_catalog">Firmen-Katalog laden</button>
    <input type="file" id="fileProject" accept=".json" style="display:none">
    <input type="file" id="fileCustomCat" accept=".json" style="display:none">
  </div>
  <dialog id="dlgCustomers" style="border:none;border-radius:12px;max-width:640px;width:92%;padding:0">
    <div class="card" style="margin:0;border-radius:12px 12px 0 0;box-shadow:none">
      <h2 data-i18n="customers.manage">Kunden</h2>
      <div class="grid">
        <div><label data-i18n="customers.name">Firmenname *</label><input id="custName" type="text"></div>
        <div><label data-i18n="customers.contact">Ansprechpartner</label><input id="custContact" type="text"></div>
        <div><label data-i18n="customers.address">Adresse</label><input id="custAddress" type="text"></div>
        <div><label data-i18n="customers.note">Notiz</label><input id="custNote" type="text"></div>
      </div>
      <div class="hint" data-i18n="customers.hint">* Pflichtfeld — alles andere optional. Kunden bleiben lokal (im Projektfile bzw. Browser-Speicher), niemals auf GitHub.</div>
      <div class="btnrow"><button class="btn ghost" id="btnCustCancel" data-i18n="common.back">Zurück</button><button class="btn" id="btnCustAdd" data-i18n="customers.add">Hinzufügen</button></div>
      <div id="custList" style="margin-top:12px"></div>
    </div>
  </dialog>
  <div class="steps" id="stepsBar"></div>
  <div id="main"></div>
  <div id="report"></div>
</div>

<script>/**
 * FlipsiTherm Rechenkern v0.2
 * Herstellerneutrale Schaltschrank-Klimaauslegung
 *
 * Norm-Bezug (Implementierung aus offenen Sekundärquellen, Normtexte nicht kopiert):
 *  - IEC TR 60890 (DE: DIN VDE 0660-507): Temperaturerhöhung, b-Faktoren der Oberflächen
 *  - EN 61439-1 Abschnitt 7.1: Übliche Betriebsbedingungen (Umgebungstemperaturen, Feuchte)
 *  - Taupunkt: Magnus-Formel (gültig 0…60 °C, φ 1–100 %)
 *
 * Grundsatz: KEINE stillen Annahmen. Jede Annahme erscheint im Ergebnis als "assumptions".
 * v0.2: Kühl- und Heizzweig UNABHÄNGIG auswertbar (nur Heizen / nur Kühlen möglich),
 * validateInput als Plausibilitäts-Gate (UI + CI), Aufstellungsvarianten erweitert
 * (Anreihung, Raumaufheizung durch benachbarte Anlagen).
 */
(function (root, factory) {
  "use strict";
  if (typeof module === "object" && module.exports) { module.exports = factory(); }
  else { root.FlipsiThermKernel = factory(); }
})(typeof self !== "undefined" ? self : this, function () {
  "use strict";

  // ---------- Konstanten ----------

  /** Wärmedurchgangskoeffizienten W/(m²·K) je Werkstoff (offene Fachquellen: FISEKON, TGB) */
  var K_VALUES = {
    "stahl_lackiert": 5.5,
    "edelstahl": 3.7,
    "aluminium": 12.0,
    "polyester": 3.5,
    "doppelwand": 4.5
  };

  /** Oberflächen-b-Faktoren in Anlehnung an IEC TR 60890 (veröffentlicht u. a. bei B&R) */
  var SURFACE_FACTORS = {
    front: 0.9,
    rear_free: 0.9,
    rear_wall: 0.7,
    side_free: 0.9,
    side_wall: 0.7,
    top_free: 1.4,
    top_covered: 0.7,
    bottom: 0.7
  };

  var HEATING_RESERVE = 1.15;   // Sicherheitszuschlag Heizleistung
  /**
   * Sprach-Tag des Kernels: "de" | "en". Die UI setzt ihn via setKernelLang()
   * (bzw. state.lang-Prop beim Boot). Alle Nutzer-Meldungen (Fehler, Warnungen,
   * Annahmen, Notizen) folgen dieser Sprache.

  function setKernelLang(l) { kernelLang = (l === "en") ? "en" : "de"; }

  /** Zweitsprachige Meldungen des Rechenkerns */
  var MSG = {
    width_range: { de: "Breite B muss zwischen 0,1 und 6 m liegen", en: "Width B must be between 0.1 and 6 m" },

    comp_n: { de: "Komponente {n}", en: "Component {n}" },

    eta_trafo: { de: "η=0,95 für Trafo angenommen", en: "η=0.95 assumed for transformers" },
    eta_motor: { de: "η=0,85 für Motor angenommen", en: "η=0.85 assumed for motors" },

    texp_default: { de: "Erwartete Umgebungstemperatur nicht angegeben: tExp={v} °C angenommen (Taupunkt-Referenz, FISEKON-Konvention)", en: "Expected ambient temperature not specified: tExp={v} °C assumed (dew-point reference, FISEKON convention)" },
    tinmin_default: { de: "Heizziel-Innentemperatur nicht angegeben: {v} °C angenommen (typ. Frostschutz-Betriebsfall)", en: "Heating-target interior temperature not specified: {v} °C assumed (typical frost-protection case)" },
    dew_over_target: { de: "Taupunkt {d} °C liegt ÜBER der Ziel-Innentemperatur {t} °C: Heizungs-Sollwert muss mindestens auf den Taupunkt gestellt werden, sonst Betauung trotz Heizbetrieb", en: "Dew point {d} °C is ABOVE the target interior temperature {t} °C: the heater setpoint must be set to at least the dew point, otherwise condensation despite heating" },
    note_cooling_unit: { de: "Umgebung ≥ zulässige Innentemperatur: Filterlüftung wirkungslos, Kühlgerät erforderlich (Ein Lüfter kann nicht unter Umgebungstemperatur kühlen).", en: "Ambient ≥ permissible interior temperature: filter ventilation ineffective, cooling unit required (a fan cannot cool below ambient temperature)." },
    note_filterfan: { de: "Bei starker Verschmutzung/Öl: Luft-Luft-Wärmetauscher als geschlossene Alternative zum Filterlüfter.", en: "With heavy dust/oil: air/air heat exchanger as a closed alternative to the filter fan." },
    note_passive: { de: "Passiver Betrieb ausreichend: die Hülle führt die Verlustwärme vollständig ab.", en: "Passive operation sufficient: the enclosure fully dissipates the loss heat." },
    note_condensation: { de: "Betauung ist bemessungsrelevant: Taupunkt {d} °C (bei erwarteter Umgebung {e} °C / {rh} % r. F.) liegt über der minimalen Umgebungstemperatur {m} °C. Heizung mit Hygrostat wählen.", en: "Condensation governs the design: dew point {d} °C (at expected ambient {e} °C / {rh} % r. h.) is above the minimum ambient temperature {m} °C. Choose a heater with hygrostat." },
    note_frost: { de: "Frostschutz ist bemessungsrelevant.", en: "Frost protection governs the design." },
    side_both_wall: { de: "beide an Wand/Anreihung", en: "both at wall/baying" },
    side_one_wall: { de: "eine Seite Nachbarschrank/Wand", en: "one side neighbour cabinet/wall" },
    side_free: { de: "beide frei", en: "both free" },
    rear_wall: { de: "an Wand", en: "at wall" },
    rear_free: { de: "frei", en: "free" },
    top_covered: { de: "abgedeckt", en: "covered" },
    top_free: { de: "frei", en: "free" },
    norm1: { de: "IEC TR 60890 (DE: DIN VDE 0660-507) — Temperaturerhöhung / b-Faktoren", en: "IEC TR 60890 (DE: DIN VDE 0660-507) — temperature rise / b-factors" },
    norm2: { de: "EN 61439-1 Abschnitt 7.1 — Übliche Betriebsbedingungen", en: "EN 61439-1 section 7.1 — ordinary operating conditions" },

    warn_tmin_gt_tmax: { de: "Minimale Umgebungstemperatur ist HÖHER als die maximale — Werte vertauscht?", en: "Minimum ambient temperature is HIGHER than the maximum — values swapped?" },

    var s = MSG[key] ? MSG[key][kernelLang] : key;
    if (vars) for (var k in vars) s = s.replace("{" + k + "}", vars[k]);
    return s;
  }

  var DEFAULT_TEXP = 25;        // °C erwartete Umgebung (Taupunkt-Referenz, FISEKON-Konvention)
  var DEFAULT_TINMIN = 5;       // °C Heizziel wenn nicht angegeben (typ. Frostschutz)

  /** EN 61439-1 / 7.1 Defaults */
  var EN61439 = {
    indoor: { tMax: 40, tMax24h: 35, tMin: -5 },
    outdoor: { tMax: 40, tMax24h: 35, tMin: -25 }
  };

  // ---------- Hilfsfunktionen ----------

  function round(x, digits) {
    var f = Math.pow(10, digits == null ? 1 : digits);
    return Math.round(x * f) / f;
  }

  function clamp(x, lo, hi) { return Math.min(Math.max(x, lo), hi); }

  /** Taupunkt nach Magnus (gültig 0…+60 °C, φ 1–100 %) */

  }

   *          "wall" (beide Seiten an Wand/Nische)
   * m.rear:  "free" | "wall" · m.top: "free" | "covered"
   */
  function effectiveSurface(e, m) {
    var B = e.widthB, H = e.heightH, T = e.depthT;
    var fRear = m.rear === "wall" ? SURFACE_FACTORS.rear_wall : SURFACE_FACTORS.rear_free;
    var fTop = m.top === "covered" ? SURFACE_FACTORS.top_covered : SURFACE_FACTORS.top_free;
    var fSideL, fSideR, noteSide;
    if (m.sides === "wall") { fSideL = SURFACE_FACTORS.side_wall; fSideR = SURFACE_FACTORS.side_wall; noteSide = tr("side_both_wall"); }
    else if (m.sides === "row") { fSideL = SURFACE_FACTORS.side_wall; fSideR = SURFACE_FACTORS.side_free; noteSide = tr("side_one_wall"); }
    else { fSideL = SURFACE_FACTORS.side_free; fSideR = SURFACE_FACTORS.side_free; noteSide = tr("side_free"); }
    var parts = {
      front: { factor: SURFACE_FACTORS.front, raw: B * H, area: SURFACE_FACTORS.front * B * H },
      rear: { factor: fRear, raw: B * H, raw_note: m.rear === "wall" ? tr("rear_wall") : tr("rear_free"), area: fRear * B * H },
      sideLeft: { factor: fSideL, raw: T * H, raw_note: noteSide, area: fSideL * T * H },
      sideRight: { factor: fSideR, raw: T * H, area: fSideR * T * H },
      top: { factor: fTop, raw: B * T, raw_note: m.top === "covered" ? tr("top_covered") : tr("top_free"), area: fTop * B * T },
      bottom: { factor: SURFACE_FACTORS.bottom, raw: B * T, area: SURFACE_FACTORS.bottom * B * T }
    };
    var area = 0, k;
    for (k in parts) { area += parts[k].area; }
    if (m.model === "fisekon_simplified") { area -= parts.bottom.area; }
    return { area: round(area, 3), breakdown: parts, model: m.model || "iec60890" };
  }

  /**
   * Verlustleistung einer Komponente.
   * Typen: direct | power_supply | drive | transformer | motor | netfilter
   */
  function componentLosses(c) {
    var f = c.loadFactor == null ? 1.0 : clamp(c.loadFactor, 0, 1);
    var eta, assumption = null;
    switch (c.type) {
      case "direct":
        return { losses: c.watts * f, formula: "P_v = " + c.watts + " W · a=" + f + (kernelLang === "en" ? " (datasheet · load)" : " (Datenblatt · Auslastung)"), assumption: null };
      case "power_supply":

        assumption = c.efficiency == null ? tr("eta_ps") : null;
        return {
          losses: c.P_out_W * (1 - eta) / eta * f,
          formula: "P_v = P_out · (1−η)/η · a = " + c.P_out_W + " · (1−" + eta + ")/" + eta + " · " + f,
          assumption: assumption
        };
      case "drive":
        eta = c.efficiency == null ? 0.97 : c.efficiency;
        assumption = c.efficiency == null ? tr("eta_drive") : null;
        return {
          losses: c.P_N_W * (1 - eta) / eta * f,
          formula: "P_v = P_N · (1−η)/η · a = " + c.P_N_W + " W · (1−" + eta + ")/" + eta + " · " + f,
          assumption: assumption
        };
      case "transformer":
        eta = c.efficiency == null ? 0.95 : c.efficiency;
        assumption = c.efficiency == null ? tr("eta_trafo") : null;
        return {
          losses: c.P_N_W * (1 - eta) / eta * f,
          formula: "P_v = P_N · (1−η)/η · a",
          assumption: assumption
        };
      case "motor":
        eta = c.efficiency == null ? 0.85 : c.efficiency;
        assumption = c.efficiency == null ? tr("eta_motor") : null;
        return {
          losses: c.P_mech_W * (1 - eta) / eta * f,
          formula: "P_v = P_mech · (1−η)/η · a",
          assumption: assumption
        };
      case "netfilter":
        var dU = c.deltaU_V == null ? 0.5 : c.deltaU_V;
        assumption = c.deltaU_V == null ? tr("eta_du") : null;
        return {
          losses: dU * c.I_load_A * f,
          formula: "P_v = ΔU · I_b = " + dU + " V · " + c.I_load_A + " A · " + f,

  /** Summierte Verlustleistung inkl. Stillstand-Anteil */
  function internalLosses(components) {
    var total = 0, idle = 0, details = [], assumptions = [], i, r;
    for (i = 0; i < components.length; i++) {
      r = componentLosses(components[i]);
      total += r.losses;
      details.push({ name: components[i].name || components[i].type, losses: round(r.losses, 1), formula: r.formula, assumption: r.assumption });
      if (r.assumption) { assumptions.push((components[i].name || components[i].type) + ": " + r.assumption); }
      if (components[i].countsAtIdle) { idle += r.losses; }
    }
    return { total: round(total, 1), idle: round(idle, 1), details: details, assumptions: assumptions };

  // ---------- Plausibilitätsprüfung (UI-Gate + Tests) ----------

  /**
   * Prüft Eingaben auf Vollständigkeit (Pflicht je Zweig) und Plausibilität.

  function validateInput(input) {

    function need(cond, msg) { if (!cond) errors.push(msg); }
    function inRange(x, lo, hi) { return typeof x === "number" && isFinite(x) && x >= lo && x <= hi; }

    need(inRange(e.widthB, 0.1, 6), tr("width_range"));
    need(inRange(e.heightH, 0.1, 4), tr("height_range"));
    need(inRange(e.depthT, 0.05, 3), tr("depth_range"));
    need(K_VALUES[input.material] != null, tr("material_missing"));

    var hasCooling = env.tMax != null && inRange(env.tMax, -55, 70) && tgt.tInMax != null && inRange(tgt.tInMax, 0, 80);
    var hasHeating = env.tMin != null && inRange(env.tMin, -55, 20);
    if (!hasCooling && !hasHeating) {
      errors.push(tr("no_case"));
    }
    if (env.tMax != null && !inRange(env.tMax, -55, 70)) errors.push(tr("tmax_implausible"));
    if (tgt.tInMax != null && !inRange(tgt.tInMax, 0, 80)) errors.push(tr("tinmax_implausible"));
    if (env.tMin != null && !inRange(env.tMin, -55, 20)) errors.push(tr("tmin_implausible"));
    if (env.rhPercent != null && !inRange(env.rhPercent, 1, 100)) errors.push(tr("rh_implausible"));
    if (env.tExp != null && !inRange(env.tExp, -55, 70)) errors.push(tr("texp_implausible"));
    if (tgt.tInMin != null && !inRange(tgt.tInMin, -30, 60)) errors.push(tr("tinmin_implausible"));
    if (env.roomHeatingK != null && !inRange(env.roomHeatingK, 0, 30)) errors.push(tr("roomheating_range"));

    if (hasCooling && tgt.tInMax <= env.tMax) {
      warnings.push(tr("warn_filterfan_useless"));
    }
    if (hasCooling && tgt.tInMax > 60) {
      warnings.push(tr("warn_tinmax60"));
    }
    if (hasHeating && tgt.tInMin != null && tgt.tInMin <= env.tMin) {
      warnings.push(tr("warn_heating_no_effect"));
    }
    if (env.tExp != null && env.tMax != null && env.tExp > env.tMax) {
      warnings.push(tr("warn_texp_gt_tmax"));
    }
    if (tgt.tInMin != null && tgt.tInMax != null && tgt.tInMin > tgt.tInMax) {
      warnings.push(tr("warn_tinmin_gt_tinmax"));
    }
    if (env.tMin != null && env.tMax != null && env.tMin > env.tMax) {
      warnings.push(tr("warn_tmin_gt_tmax"));
    }

      if (c.type === "power_supply" && !inRange(c.P_out_W, 0.1, 50000)) errors.push(n + ": " + tr("pout_range"));
      if (c.type === "drive" && !inRange(c.P_N_W, 0.1, 2000000)) errors.push(n + ": " + tr("pn_range"));
      if (c.type === "transformer" && !inRange(c.P_N_W, 0.1, 2000000)) errors.push(n + ": " + tr("pn_range"));
      if (c.type === "motor" && !inRange(c.P_mech_W, 0.1, 2000000)) errors.push(n + ": " + tr("pmech_range"));

  // ---------- Hauptberechnung ----------

  /**
   * Vollständige Klimaauslegung. Kühl- und Heizzweig unabhängig:

  function calculate(input) {
    var v = validateInput(input);
    if (v.errors.length) { throw new Error(v.errors[0] + (v.errors.length > 1 ? tr("more_errors", {n: v.errors.length - 1}) : "")); }

    var e = input.enclosure;
    var m = input.mounting || {};
    var env0 = input.environment;
    var tgt = input.target || {};
    var roomK = env0.roomHeatingK || 0;

    // Raumaufheizung durch benachbarte Anlagen: wirkt auf alle Umgebungstemperaturen
    var env = {
      tMax: env0.tMax != null ? round(env0.tMax + roomK, 1) : null,
      tExp: env0.tExp != null ? round(env0.tExp + roomK, 1) : null,
      tMin: env0.tMin != null ? round(env0.tMin + roomK, 1) : null,
      rhPercent: env0.rhPercent,

    var losses = internalLosses(input.components || []);
    var surf = effectiveSurface(e, m);
    var k = K_VALUES[input.material];
    var assumptions = losses.assumptions.slice();

    if (roomK) { assumptions.push(tr("room_heating", {k: roomK})); }
    if (env.rhPercent == null) { env.rhPercent = DEFAULT_RH; assumptions.push(tr("rh_default", {rh: DEFAULT_RH})); }
    if (env.altitude_m != null && env.altitude_m > 1000) {
      assumptions.push(tr("altitude", {alt: env.altitude_m}));
    }

    // --- Kühlung (optional) — Zweig nur, wenn Kühl-Eingaben vollständig angegeben ---
    var cooling = null;
    if (v.hasCooling) {

      var solution;
      if (qCool <= 0) { solution = "passive"; }
      else if (fanPossible) { solution = "filterfan"; }
      else { solution = "cooling_unit"; }
      cooling = {
        dT: round(dT_cool, 1),
        shellDissipation: round(shellDiss_cool, 1),
        qCool: qCool,
        airflow_m3h: airflow,
        fanPossible: fanPossible,
        solution: solution,
        note: solution === "cooling_unit"
          ? tr("note_cooling_unit")
          : (solution === "filterfan" ? tr("note_filterfan") : tr("note_passive"))

    }

    // --- Heizung (optional) — Zweig nur, wenn Heiz-Eingabe angegeben ---
    var heating = null;
    if (v.hasHeating) {
      var tInMin = tgt.tInMin == null ? DEFAULT_TINMIN : tgt.tInMin;
      var tExp = env.tExp == null ? DEFAULT_TEXP : env.tExp;
      if (env0.tExp == null) { assumptions.push(tr("texp_default", {v: DEFAULT_TEXP})); }
      if (tgt.tInMin == null) { assumptions.push(tr("tinmin_default", {v: tInMin})); }
      var dewRef = dewPoint(tExp, env.rhPercent);
      if (tExp < 0 || tExp > 60) { assumptions.push(tr("warn_magnus_range", {v: tExp})); }
      var dT_heat_frost = tInMin - env.tMin;
      var dT_heat_dew = dewRef - env.tMin;
      var loss_frost = k * surf.area * Math.max(dT_heat_frost, 0);
      var loss_dew = k * surf.area * Math.max(dT_heat_dew, 0);
      var pFrost = round(Math.max(0, (loss_frost - losses.idle) * HEATING_RESERVE), 0);
      var pDew = round(Math.max(0, (loss_dew - losses.idle) * HEATING_RESERVE), 0);
      var pHeater = Math.max(pFrost, pDew);
      var condensationGoverns = pDew > pFrost;
      if (dewRef > tInMin) {
        assumptions.push(tr("dew_over_target", {d: round(dewRef, 1), t: tInMin}));
      }
      heating = {
        tAmbMin: env.tMin,
        tExp: tExp,
        dewPoint: round(dewRef, 1),
        dTFrost: round(dT_heat_frost, 1),
        dTDew: round(dT_heat_dew, 1),

        lossDew: round(loss_dew, 0),

        condensationGoverns: condensationGoverns,
        note: pHeater <= 0

          : tr("note_frost"))

    }

    return {
      meta: {
        tool: "FlipsiTherm", version: "0.2.5",
        normRefs: [
          tr("norm1"), tr("norm2")
        ]
      },
      surface: surf,
      kValue: k,
      losses: losses,
      environment: env,
      target: tgt,
      cooling: cooling,
      heating: heating,
      assumptions: assumptions,
      warnings: v.warnings
    };
  }

  // Öffentliches API
  return {
    setKernelLang: setKernelLang,
    getKernelLang: getKernelLang,
    K_VALUES: K_VALUES,
    SURFACE_FACTORS: SURFACE_FACTORS,
    EN61439: EN61439,
    dewPoint: dewPoint,

    componentLosses: componentLosses,
    internalLosses: internalLosses,
    validateInput: validateInput,
    calculate: calculate

/* ---------- i18n ---------- */
function t(key, vars){
  var src = EMBEDDED.lang[state.lang] || {};
  var s = (src[key] != null) ? src[key] : (EMBEDDED.lang.de[key] != null ? EMBEDDED.lang.de[key] : key);
  if (vars) for (var k in vars) s = s.replace("{"+k+"}", vars[k]);
  return s;
}
function flatten(obj, prefix){
  var out={};
  (function walk(o,p){ for (var k in o){ if (o[k] && typeof o[k]==="object") walk(o[k], p+k+"."); else out[p+k]=String(o[k]); } })(obj, prefix||"");
  return out;
}
function applyI18n(){
  document.documentElement.lang = state.lang;
  document.querySelectorAll("[data-i18n]").forEach(function(el){ el.textContent = t(el.getAttribute("data-i18n")); });
  document.querySelectorAll("[data-i18n-title]").forEach(function(el){ el.title = t(el.getAttribute("data-i18n-title")); });

/* ---------- Kataloge ---------- */
function mergeCatalogs(){
  state.catDevices = [];
  EMBEDDED.catalogs.forEach(function(c){ c.devices.forEach(function(d){ state.catDevices.push(Object.assign({},d,{layer:1,hersteller:c.hersteller})); }); });
  (state.firmCatalog && state.firmCatalog.devices || []).forEach(function(d){ state.catDevices.push(Object.assign({},d,{layer:2})); });
  state.customDevs.forEach(function(d){ state.catDevices.push(Object.assign({},d,{layer:3})); });
}
function fetchJSON(url){ return fetch(url).then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); }); }
/* Client-seitige Katalog-Sanity: nur wohlgeformte, plausible Datensätze werden akzeptiert.
   (Daten-only bleibt gewahrt: JSON.parse + Feldprüfung, keine Ausführung.) */
function validateCatalog(c){
  if (!c || !Array.isArray(c.devices) || c.devices.length < 3) return false;
  if (typeof c.hersteller!=="string" || c.hersteller.length<2) return false;
  if (!/^\d{4}-\d{2}-\d{2}$/.test(c.stand||"")) return false;
  var TYPES={heizung:"leistung_W",filterluefter:"luftstrom_m3h",waermetauscher:"waermeleistung_wk",kuehlgeraet:"kuehlleistung_W"};
  for (var i=0;i<c.devices.length;i++){
    var d=c.devices[i], vf=TYPES[d.typ];
    if (!vf) return false;
    var hasVal = (typeof d[vf]==="number" && d[vf]>0) || (d.typ==="waermetauscher" && typeof d.kuehlleistung_W==="number" && d.kuehlleistung_W>0);
    if (!hasVal) return false;
    if (typeof d.bezeichnung!=="string" || d.bezeichnung.length<2) return false;
    if (d.status && d.status!=="verifiziert" && d.status!=="zu_verifizieren") return false;
  }
  return true;
}
function setBadge(stand, online){
  var b=document.getElementById("catalogBadge");
  b.textContent = t(online?"app.online_badge":"app.offline_badge", {stand:stand});
  b.classList.toggle("online", !!online);
}
async function autoRefresh(){ // NUR Daten nachladen (JSON) — niemals Code
  if (!EMBEDDED.config.autoUpdate || !navigator.onLine){ setBadge(EMBEDDED.config.catalogStand, false); return; }
  try{
    var fetched = await Promise.all(EMBEDDED.config.catalogFiles.map(function(f){ return fetchJSON(DATA_BASE+"data/catalogs/"+f); }));
    fetched = (fetched||[]).filter(function(c,i){ var ok=validateCatalog(c); if(!ok) console.warn("Katalog verworfen (Schema-Fail):", EMBEDDED.config.catalogFiles[i]); return ok; });
    if (fetched.length){
      EMBEDDED.catalogs = fetched;
      EMBEDDED.config.catalogStand = fetched.map(function(c){ return c.stand; }).sort().reverse()[0] || EMBEDDED.config.catalogStand;
    }
    var langIdx = await fetchJSON(DATA_BASE+"data/lang/index.json").catch(function(){ return {languages:[]}; });
    for (var li of (langIdx.languages||[])){
      try{
        var raw = await fetchJSON(DATA_BASE+"data/lang/"+li+".json");
        // MERGE statt Replace: eingebettete Basis-Keys bleiben erhalten, online kommen nur Zusätze/Updates dazu.
        var merged = {};
        for (var k in EMBEDDED.lang[li]) merged[k] = EMBEDDED.lang[li][k];
        var flat = flatten(raw);
        for (var k2 in flat) merged[k2] = flat[k2];
        EMBEDDED.lang[li] = merged;
      }catch(e){}
    }
    refreshLangMenu();
    setBadge(EMBEDDED.config.catalogStand, true);
    mergeCatalogs();
    applyI18n();
  }catch(e){ setBadge(EMBEDDED.config.catalogStand, false); }
}
function refreshLangMenu(){
  var sel=document.getElementById("langSel"); var cur=sel.value; sel.innerHTML="";
  Object.keys(EMBEDDED.lang).sort().forEach(function(l){
    var o=document.createElement("option"); o.value=l; o.textContent=l.toUpperCase(); sel.appendChild(o);
  });
  sel.value=cur;
}

function getPath(path,key){ return path.split(".").reduce(function(o,k){ return o[k]; }, state.project)[key]; }
function setPath(path,key,val){ path.split(".").reduce(function(o,k){ return o[k]; }, state.project)[key]=val; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function safeUrl(u){
  // Nur http(s) erlauben — blockt javascript:, data:, vbscript: aus Katalog-Daten (XSS)
  var s = String(u||"").trim();
  return /^https?:\/\//i.test(s) ? s : null;
}
function numInput(label, key, step, stepAttr){
  return '<div><label>'+label+'</label><input type="number" step="'+(stepAttr||"0.1")+'" value="'+esc(getPath(step,key))+'" data-bind="'+key+'" data-step="'+step+'"></div>';
}
function bindInputs(container){
  container.querySelectorAll("input[data-bind]").forEach(function(inp){
    inp.addEventListener("input", function(){
      // Leeres Feld = Wert NICHT angegeben (null) — sonst würden leere Felder als 0 °C gelten
      setPath(inp.getAttribute("data-step"), inp.getAttribute("data-bind"), inp.value==="" ? null : parseFloat(inp.value));
    });
  });
  container.querySelectorAll("select[data-bind]").forEach(function(sel){
    sel.addEventListener("change", function(){
      if (sel.getAttribute("data-step")==="_material"){ state.project.material=sel.value; }
      else { setPath(sel.getAttribute("data-step"), sel.getAttribute("data-bind"), sel.value); }
    });
  });
}

  else if (ct==="select"){ c[f]=ev.target.value; renderComponentList(document.getElementById("compList")); return; }
  else if (ct==="text") c[f]=ev.target.value;
  else c[f]=ev.target.value===""?null:parseFloat(ev.target.value);
}
function runCalc(){
  var v = FlipsiThermKernel.validateInput(state.project);
  var box = document.getElementById("gateErrors");
  var msg = "";
  if (v.errors.length) msg = v.errors.map(function(e){ return "⛔ "+esc(e); }).join("<br>");
  if (v.warnings.length) msg += (msg?"<br>":"") + v.warnings.map(function(w){ return "⚠ "+esc(w); }).join("<br>");
  if (box) box.innerHTML = msg;
  state.gateMsg = msg; // Meldung über Schrittwechsel hinweg erhalten
  if (v.errors.length) return; // Pflichtwerte fehlen → kein Schritt 4 (Warnungen erscheinen zusätzlich im Ergebnis)
  try{
    state.lastResult = FlipsiThermKernel.calculate(state.project);
    state.gateMsg = "";
    goto(4);
  }catch(e){ alert(t("msg.calc_error")+e.message); }
}

/* ---------- Ergebnis ---------- */
function renderResult(){
  var r=state.lastResult;
  var root=document.getElementById("main");
  if(!r){ root.innerHTML='<div class="card">'+t("common.calculate")+'</div>'; return; }
  var kpi='<div class="kpi">'+
    (r.cooling ?
      '<div class="box"><h3>'+t(SOLUTIONS_KEY(r.cooling.solution))+'</h3><div class="val">'+(r.cooling.solution==="cooling_unit"?"≥ "+r.cooling.qCool+" W":r.cooling.solution==="filterfan"?r.cooling.airflow_m3h+" m³/h":"0 W")+'</div><div class="sub">'+t(SOLUTIONS_KEY(r.cooling.solution)).replace(/[A-Za-zäöüß ]+—/,"")+' · '+t("results.q_cool")+': '+r.cooling.qCool+' W</div></div>'+
      (r.cooling.airflow_m3h>0?'<div class="box"><h3>'+t("results.airflow")+'</h3><div class="val">'+r.cooling.airflow_m3h+' m³/h</div><div class="sub">V = 3,1·Q/ΔT</div></div>':"")
    : "")+
    (r.heating ?
      '<div class="box"><h3>'+t("results.heater")+'</h3><div class="val">'+r.heating.required+' W</div><div class="sub">'+(r.heating.condensationGoverns?t("results.condensation_note"):t("results.frost_note"))+'</div></div>'+
      '<div class="box"><h3>'+t("results.dewpoint")+'</h3><div class="val">'+r.heating.dewPoint+' °C</div><div class="sub">Magnus · '+r.heating.tExp+' °C / '+r.environment.rhPercent+' %</div></div>'
    : "")+'</div>';
  var assumptions='<details><summary>'+t("results.assumptions")+' ('+r.assumptions.length+')</summary><div class="inner"><ul>'+
    (r.assumptions.length?r.assumptions.map(function(a){return "<li>"+esc(a)+"</li>";}).join(""):"<li>"+t("results.none")+"</li>")+'</ul></div></details>';
  var warnBox=(r.warnings&&r.warnings.length)?'<div class="card" style="border-color:var(--warn)">'+r.warnings.map(function(w){return "⚠ "+esc(w);}).join("<br>")+'</div>':"";
  root.innerHTML=warnBox+kpi+
    '<div class="card"><h2>'+t("results.devices")+'</h2><div id="devTable"></div>'+assumptions+
    '<div class="btnrow"><button class="btn ghost" onclick="goto(3)">← '+t("common.back")+'</button>'+
    '<button class="btn" id="btnPrint">'+t("report.print")+'</button></div></div>';
  renderDeviceSuggestions(document.getElementById("devTable"));
  document.getElementById("btnPrint").onclick=buildReport;
}
function SOLUTIONS_KEY(s){ return SOLUTION_KEY_MAP[s]; }
var SOLUTION_KEY_MAP={passive:"results.solution_passive",filterfan:"results.solution_filterfan",heatexchanger:"results.solution_heatexchanger",cooling_unit:"results.solution_cooling_unit"};
function renderDeviceSuggestions(el){
  var r=state.lastResult; var rows=""; var need={};
  if (r.cooling && r.cooling.solution==="filterfan"){ need.filterluefter=r.cooling.airflow_m3h; need.waermetauscher=r.cooling.qCool; }
  if (r.cooling && r.cooling.solution==="cooling_unit") need.kuehlgeraet=r.cooling.qCool;
  if (r.heating && r.heating.required>0) need.heizung=r.heating.required;
  var TYP_LABELS={heizung:t("results.typ_heizung"),filterluefter:t("results.typ_filterluefter"),waermetauscher:t("results.typ_waermetauscher"),kuehlgeraet:t("results.typ_kuehlgeraet")};
  for (var typ in need){
    (function(typ){
      var req=need[typ];
      var fit=state.catDevices.filter(function(d){ return d.typ===typ &&
        (typ==="heizung" ? (d.leistung_W||0)>=req*0.9 :
         typ==="filterluefter" ? (d.luftstrom_m3h||0)>=req :
         typ==="waermetauscher" ? (d.waermeleistung_wk ? d.waermeleistung_wk*(r.cooling.dT||1)>=req : (d.kuehlleistung_W||0)>=req) :
         (d.kuehlleistung_W||0)>=req); });
      fit.sort(function(a,b){
        function val(x){ return typ==="heizung"?(x.leistung_W||0):typ==="filterluefter"?(x.luftstrom_m3h||0):typ==="waermetauscher"?((x.waermeleistung_wk||0)*(r.cooling.dT||1)):(x.kuehlleistung_W||0); }
        return val(a)-val(b);
      });
      rows+="<tr><td colspan='5' style='font-weight:600;color:var(--accent-dark);padding-top:12px'>"+TYP_LABELS[typ]+" ≥ "+Math.round(typ==="heizung"?req*0.9:req)+"</td></tr>";
      fit.slice(0,4).forEach(function(d){
        rows+="<tr><td>"+esc(d.hersteller)+"</td><td>"+esc(d.bezeichnung)+(d.kuehl_nennbedingung?" <span class='badge'>"+esc(d.kuehl_nennbedingung)+"</span>":"")+"</td><td>"+(d.leistung_W?d.leistung_W+" W":d.waermeleistung_wk?d.waermeleistung_wk+" W/K (≈"+Math.round(d.waermeleistung_wk*(r.cooling.dT||1))+" W bei ΔT "+r.cooling.dT+" K)":d.kuehlleistung_W+" W")+(d.artikel_nr?" · Art. "+esc(d.artikel_nr):"")+"</td><td><span class='badge'>"+["",t("results.origin_community"),t("results.origin_firm"),t("results.origin_project")][d.layer]+"</span>"+(d.status==="zu_verifizieren"?" <span class='badge'>⚠ "+t("results.to_verify")+"</span>":"")+"</td><td>"+(safeUrl(d.quell_url)?"<a href='"+esc(safeUrl(d.quell_url))+"' target='_blank' rel='noopener'>"+t("results.source")+"</a>":"")+"</td></tr>";
      });
      if (fit.length===0) rows+="<tr><td colspan='5' class='hint'>"+(typ==="waermetauscher"?t("results.no_wta"):t("results.no_device").replace("{typ}",TYP_LABELS[typ]).replace("{req}",String(Math.round(req))))+"</td></tr>";
    })(typ);
  }
  el.innerHTML="<table><tr><th>"+t("results.th_manufacturer")+"</th><th>"+t("results.th_device")+"</th><th>"+t("results.th_value")+"</th><th>"+t("results.th_origin")+"</th><th></th></tr>"+rows+"</table>"+
    "<div class='hint'>"+t("results.catalog_note").replace("{stand}",EMBEDDED.config.catalogStand)+"</div>";
}

/* ---------- Protokoll ---------- */
function reportData(r){
  var p=state.project;
  var rows=[];
  if (r.cooling){
    rows.push(["ΔT "+t("rc.dt_cool"), r.cooling.dT+" K", "ΔT = T_zul,innen − T_um,max", "IEC TR 60890"]);
    rows.push([t("rc.shell"), r.cooling.shellDissipation+" W", "Q = k·A·ΔT", "IEC TR 60890"]);
    rows.push([t("rc.q_cool"), r.cooling.qCool+" W", "Q_K = P_v − k·A·ΔT", "IEC TR 60890"]);
    if (r.cooling.airflow_m3h>0) rows.push([t("rc.airflow"), r.cooling.airflow_m3h+" m³/h","V = 3,1·Q/ΔT",t("rc.airflow_ref")]);
  }
  if (r.heating){
    rows.push([t("rc.dew"), r.heating.dewPoint+" °C",t("rc.magnus"),t("rc.dew_valid")]);
    rows.push([t("rc.heating_frost"), r.heating.pFrost+" W","(k·A·ΔT − P_idle)·1,15",t("rc.frost_ref")]);
    rows.push([t("rc.heating_dew"), r.heating.pDew+" W","(k·A·(τ − T_min) − P_idle)·1,15",t("rc.dew_ref")]);
    rows.push([t("rc.heating_req"), r.heating.required+" W",t("rc.max_formula"),"—"]);
  }
  var cust = state.customers.find(function(c){ return c.name===p.customer.name; }) || null;
  return {
    customer: p.customer.name||"—",
    ref: p.customer.ref||"",
    custContact: (cust&&cust.contact)||"",
    custAddress: (cust&&cust.address)||"",
    date: new Date().toLocaleDateString(state.lang==="en" ? "en-GB" : "de-AT"),
    sw: r.meta.tool+" v"+r.meta.version,
    catStand: EMBEDDED.config.catalogStand,
    inputs: [
      [t("ri.cabinet"), p.enclosure.widthB+" × "+p.enclosure.heightH+" × "+p.enclosure.depthT+" m"],
      [t("ri.material"), t("materials."+p.material)+" (k = "+r.kValue+" W/(m²·K))"],
      [t("ri.mounting"), t("mounting.rear")+" "+t("mounting."+p.mounting.rear)+" · "+t("mounting.sides")+" "+t("mounting."+p.mounting.sides)+" · "+t("mounting.top")+" "+t("mounting."+p.mounting.top)],
      [t("ri.surface"), r.surface.area+" "+t("ri.surface_detail")],
      [t("ri.ambient"), (r.environment.tMax!=null?"max "+r.environment.tMax+" °C · ":"")+(r.heating&&r.heating.tExp!=null?t("ri.expected")+" "+r.heating.tExp+" °C · ":"")+(r.environment.tMin!=null?"min "+r.environment.tMin+" °C · ":"")+"φ "+r.environment.rhPercent+" %"],
      [t("ri.target"), (r.target.tInMax!=null?"max "+r.target.tInMax+" °C"+(r.target.tInMin!=null?" · ":""):"")+(r.target.tInMin!=null?t("ri.heating_target")+" "+r.target.tInMin+" °C":"")],
      [t("ri.losses"), r.losses.total+" "+t("ri.losses_detail").replace("{idle}", r.losses.idle)]
    ],
    surfaceRows: Object.keys(r.surface.breakdown).map(function(k){
      var b=r.surface.breakdown[k];
      return [t("surf."+k), "b="+b.factor, (b.raw?b.raw.toFixed(3):"0")+" m² → "+b.area.toFixed(3)+" m²"+(b.raw_note?" ("+b.raw_note+")":"")];
    }),
    calc: rows,
    assumptions: r.assumptions,
    warnings: r.warnings||[],
    losses: r.losses.details,
    normRefs: r.meta.normRefs
  };
}
function buildReport(){
  var r=state.lastResult; if(!r) return;
  var d=reportData(r);
  var el=document.getElementById("report");
  el.innerHTML='<div class="report-page report"><h1>'+t("report.header")+'</h1>'+
    '<div class="meta"><b>'+esc(d.customer)+'</b>'+(d.custAddress?" · "+esc(d.custAddress):"")+(d.custContact?" · "+esc(d.custContact):"")+(d.ref?" · <b>"+esc(d.ref)+"</b>":"")+'</div>'+
    '<div class="meta">'+d.date+' · '+d.sw+' · '+t("app.cat_stand")+' '+d.catStand+'</div>'+
    '<h2>'+t("report.inputs")+'</h2><table><tbody>'+
    d.inputs.map(function(x){ return "<tr><td style='width:38%'>"+esc(x[0])+"</td><td><b>"+esc(x[1])+"</b></td></tr>"; }).join("")+'</tbody></table>'+
    '<h2>'+t("report.surface_h")+'</h2><table><thead><tr><th>'+t("report.th_surface")+'</th><th>'+t("report.th_factor")+'</th><th>'+t("report.th_effective")+'</th></tr></thead><tbody>'+
    d.surfaceRows.map(function(x){ return "<tr><td>"+esc(x[0])+"</td><td>"+esc(x[1])+"</td><td>"+esc(x[2])+"</td></tr>"; }).join("")+'</tbody></table>'+
    '<h2>'+t("report.losses_h")+'</h2><table><thead><tr><th>'+t("report.th_component")+'</th><th>'+t("report.th_loss")+'</th><th>'+t("report.formula")+'</th></tr></thead><tbody>'+
    (d.losses.length?d.losses.map(function(x){ return "<tr><td>"+esc(x.name)+"</td><td><b>"+x.losses+" W</b></td><td>"+esc(x.formula)+"</td></tr>"; }).join(""):"<tr><td colspan=3>—</td></tr>")+'</tbody></table>'+
    '<h2>'+t("report.calculation")+'</h2><table><thead><tr><th>'+t("report.th_qty")+'</th><th>'+t("report.th_result")+'</th><th>'+t("report.formula")+'</th><th>'+t("report.norm")+'</th></tr></thead><tbody>'+
    d.calc.map(function(x){ return "<tr><td>"+esc(x[0])+"</td><td><b>"+esc(x[1])+"</b></td><td>"+esc(x[2])+"</td><td class='norm'>"+esc(x[3])+"</td></tr>"; }).join("")+'</tbody></table>'+
    (d.assumptions.length?("<h2>"+t("results.assumptions")+"</h2><ul style='font-size:.8rem'>"+d.assumptions.map(function(a){return "<li>"+esc(a)+"</li>";}).join("")+"</ul>"):"")+
    (d.warnings&&d.warnings.length?("<h2>"+t("results.warnings")+"</h2><ul style='font-size:.8rem'>"+d.warnings.map(function(wn){return "<li>"+esc(wn)+"</li>";}).join("")+"</ul>"):"")+
    '<div class="foot">'+t("report.footer_note")+' · '+t("report.norm_refs")+': '+d.normRefs.map(esc).join(" · ")+'</div></div>';
  el.style.display="block";
  window.print();
  el.style.display="none"; // Protokoll nur für den Druck sichtbar
}

/* ---------- Projekt + Firmen-Katalog ---------- */
function saveProject(){
  var blob=new Blob([JSON.stringify({flipsitherm_project:"2",saved:new Date().toISOString(),project:state.project,customDevs:state.customDevs,customers:state.customers},null,2)],{type:"application/json"});
  var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="FlipsiTherm-Projekt.json"; a.click();
}
function loadProject(file){
  file.text().then(function(txt){
    var j=JSON.parse(txt);
    if (j.flipsitherm_project!=="1" && j.flipsitherm_project!=="2") throw new Error(t("msg.not_project"));
    var p=j.project||{};
    // Defaults: Projektdateien können Teilfelder fehlen — UI darf nicht crashen
    p.customer=p.customer||{}; p.customer.name=p.customer.name||""; p.customer.ref=p.customer.ref||"";
    p.enclosure=p.enclosure||{}; p.mounting=p.mounting||{rear:"free",sides:"free",top:"free",model:"iec60890"};
    p.environment=p.environment||{}; p.target=p.target||{}; p.components=p.components||[];
    p.material=p.material||"stahl_lackiert";
    state.project=p;
    state.customDevs=j.customDevs||[];
    // Kunden MERGEN (nach Name) statt ersetzen — Projekt-Load darf den lokalen Stamm nicht löschen
    var incoming=j.customers||[];
    incoming.forEach(function(ic){ if(!state.customers.some(function(c){ return c.name===ic.name; })) state.customers.push(ic); });
    saveCustomers(state.customers);
    state.lastResult=null; // altes Ergebnis gehört zum alten Projekt
    mergeCatalogs(); goto(1); renderCustomerSelect(); renderCustomerList();
  }).catch(function(e){ alert(t("msg.proj_unreadable")+e.message); });
}
function loadCustomCatalog(file){
  file.text().then(function(txt){
    var j=JSON.parse(txt);
    if (!j.devices) throw new Error(t("msg.devices_missing"));
    j.devices.forEach(function(d){ d.layer=2; if(!d.hersteller) d.hersteller=j.hersteller||t("msg.firm_default"); });
    if (!validateCatalog(j)) throw new Error(t("msg.cat_schema"));
    state.firmCatalog=j; mergeCatalogs();
    alert(t("msg.cat_loaded").replace("{n}", j.devices.length));
  }).catch(function(e){ alert(t("msg.cat_unreadable")+e.message); });
}

/* ---------- Kundenverwaltung (lokal, niemals öffentlich) ---------- */
function loadCustomers(){
  try { return JSON.parse(localStorage.getItem("flipsitherm_customers")||"[]"); } catch(e){ return []; }
}
function saveCustomers(list){ try { localStorage.setItem("flipsitherm_customers", JSON.stringify(list)); } catch(e){} }
function renderCustomerSelect(){
  var sel=document.getElementById("custSelect"); if(!sel) return;
  var cur=state.project.customer.name||"";
  sel.innerHTML='<option value="">— '+t("customers.none")+' —</option>';
  state.customers.forEach(function(c,i){
    var o=document.createElement("option"); o.value=c.name; o.textContent=c.name+(c.address?" · "+c.address:""); sel.appendChild(o);
  });
  sel.value=cur;
}
function renderCustomerList(){
  var el=document.getElementById("custList"); el.innerHTML="";
  state.customers.forEach(function(c,i){
    var row=document.createElement("div");
    row.className="hint"; row.style.display="flex"; row.style.gap="8px"; row.style.alignItems="center";
    row.innerHTML="<span style='color:var(--ink)'><b>"+esc(c.name)+"</b>"+(c.address?" · "+esc(c.address):"")+(c.note?" · "+esc(c.note):"")+"</span>";
    var del=document.createElement("button"); del.className="btn ghost small"; del.textContent="✕";
    del.onclick=function(){ state.customers.splice(i,1); saveCustomers(state.customers); renderCustomerSelect(); renderCustomerList(); };
    row.appendChild(del); el.appendChild(row);
  });
}
function applyTheme(){
  var th = localStorage.getItem("flipsitherm_theme") || "light";
  document.documentElement.setAttribute("data-theme", th);
  document.getElementById("btnTheme").textContent = th==="dark" ? "☀" : "◐";
}
function toggleTheme(){
  var th = (localStorage.getItem("flipsitherm_theme")==="dark") ? "light" : "dark";
  localStorage.setItem("flipsitherm_theme", th); applyTheme();
}

/* ---------- Boot ---------- */
function boot(){
  // eingebettete Sprachen (nested JSON) → flache Keys
  Object.keys(EMBEDDED.lang).forEach(function(l){
    if (typeof EMBEDDED.lang[l]==="object" && EMBEDDED.lang[l].app) EMBEDDED.lang[l]=flatten(EMBEDDED.lang[l]);
  });
  var sel=document.getElementById("langSel");
  sel.addEventListener("change",function(){ state.lang=sel.value; if (FlipsiThermKernel.setKernelLang) FlipsiThermKernel.setKernelLang(state.lang); applyI18n(); });
  document.getElementById("btnSave").onclick=saveProject;
  document.getElementById("btnLoad").onclick=function(){ document.getElementById("fileProject").click(); };
  document.getElementById("fileProject").addEventListener("change",function(e){ if(e.target.files[0]) loadProject(e.target.files[0]); e.target.value=""; });
  document.getElementById("btnCustomCat").onclick=function(){ document.getElementById("fileCustomCat").click(); };
  document.getElementById("fileCustomCat").addEventListener("change",function(e){ if(e.target.files[0]) loadCustomCatalog(e.target.files[0]); e.target.value=""; });
  // Theme
  applyTheme();
  document.getElementById("btnTheme").addEventListener("click", toggleTheme);
  // Kunden laden (Browser-Speicher) + Dialog
  try { state.customers = JSON.parse(localStorage.getItem("flipsitherm_customers")||"[]"); } catch(e){ state.customers=[]; }
  var dlg=document.getElementById("dlgCustomers");
  document.getElementById("btnCustomers").onclick=function(){ renderCustomerList(); dlg.showModal(); };
  document.getElementById("btnCustCancel").onclick=function(){ dlg.close(); };
  document.getElementById("btnCustAdd").onclick=function(){
    var n=document.getElementById("custName").value.trim();
    if(!n){ alert(t("customers.name_required")); return; }
    if (state.customers.some(function(c){ return c.name===n; })) { alert(t("customers.dup")); return; }
    state.customers.push({name:n, contact:document.getElementById("custContact").value.trim(), address:document.getElementById("custAddress").value.trim(), note:document.getElementById("custNote").value.trim()});
    saveCustomers(state.customers);
    document.getElementById("custName").value=""; document.getElementById("custContact").value=""; document.getElementById("custAddress").value=""; document.getElementById("custNote").value="";
    renderCustomerSelect(); renderCustomerList();
  };
  mergeCatalogs(); refreshLangMenu(); sel.value=state.lang;
  if (FlipsiThermKernel.setKernelLang) FlipsiThermKernel.setKernelLang(state.lang);
  renderSteps(); renderStep(); applyI18n();
  autoRefresh();
}
document.addEventListener("DOMContentLoaded",boot);
</script>
